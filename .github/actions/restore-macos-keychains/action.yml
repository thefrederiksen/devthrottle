# Take sign-macos's temporary keychain back out of the user's keychain search list, and delete it.
# Call it with `if: always()` after the last step that signs.
#
# WHY IT IS A SEPARATE ACTION. `security list-keychains -s` changes state that belongs to the USER,
# not to the job: it outlives the job and every later job on the same machine reads it. On a
# GitHub-hosted runner that does not matter, because the machine is destroyed - but this repository
# also runs work on a self-hosted Mac, where a temporary keychain dies with RUNNER_TEMP and would
# leave a dangling entry in the search list for everything that followed. A composite action cannot
# register a `post:` step, so the cleanup is its own action and each job calls it.
#
# WHY IT REMOVES ONE ENTRY RATHER THAN RESTORING A SAVED LIST. The three macOS jobs of a release run
# at the same time. Two runners under one account, each saving the list on the way in and writing its
# own copy back on the way out, race: the first to finish restores a list from before the second
# existed, which deletes the second's keychain while it is still signing, and the second's restore
# then puts the first's dead entry back. Adding one entry and later removing that same one entry is
# safe however many jobs overlap.
#
# Safe to call when there is nothing to do: with an empty input it says so and changes nothing.

name: Restore the macOS keychain search list
description: Remove the temporary signing keychain from the user's search list and delete it.

inputs:
  keychain:
    description: The keychain output of sign-macos. Empty means none was created, so there is nothing to undo.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        KEYCHAIN: ${{ inputs.keychain }}
      run: |
        set -uo pipefail

        if [[ -z "${KEYCHAIN}" ]]; then
          echo "No temporary signing keychain was created - nothing to undo."
          exit 0
        fi

        # Keychain paths are compared RESOLVED. `security list-keychains` prints the real path, and on
        # macOS /var is a symbolic link to /private/var - so RUNNER_TEMP's own
        # /var/folders/.../x.keychain-db comes back as /private/var/folders/.../x.keychain-db and a plain
        # string comparison misses it. Measured: the cleanup silently removed nothing at all.
        resolve_path() {
          local p="$1" dir base
          dir="$(dirname "$p")"
          base="$(basename "$p")"
          if cd "$dir" 2>/dev/null; then
            printf '%s/%s\n' "$(pwd -P)" "$base"
            cd - >/dev/null 2>&1 || true
          else
            printf '%s\n' "$p"
          fi
        }

        OURS="$(resolve_path "${KEYCHAIN}")"

        # Everything currently on the list EXCEPT ours, each path its own array element so a path with
        # a space in it stays one argument.
        KEEP=()
        REMOVED=0
        while IFS= read -r line; do
          [[ -z "$line" ]] && continue
          if [[ "$(resolve_path "$line")" == "$OURS" ]]; then
            REMOVED=1
            continue
          fi
          KEEP+=("$line")
        done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"?//; s/"?[[:space:]]*$//')

        if [[ "$REMOVED" != "1" ]]; then
          echo "Our keychain is not on the search list (already removed, or never added)."
        fi

        if [[ ${#KEEP[@]} -eq 0 ]]; then
          # Setting an empty list would leave this user with no keychains at all, which is worse than
          # the dangling entry this step exists to remove.
          echo "WARNING: our keychain is the only one on the search list; leaving the list alone."
        else
          security list-keychains -d user -s "${KEEP[@]}"
          echo "keychain search list is now:"
          security list-keychains -d user | sed 's/^/  /'
        fi

        # Deleted last, so a failure above does not also leave the keychain file behind.
        if security delete-keychain "${KEYCHAIN}" 2>/dev/null; then
          echo "deleted the temporary signing keychain"
        else
          echo "the temporary signing keychain was already gone"
        fi
