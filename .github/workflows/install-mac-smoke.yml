name: install-mac smoke

# Runs the one-line macOS installer end to end on a real Apple Silicon runner,
# against the latest published release, on a Mac whose developer tools are
# broken. A user hit exactly that: /usr/bin/python3 is only a stub that hands
# off to Xcode, his Xcode was broken, and the installer died before it could
# verify the download. The installer must never depend on developer tools.

on:
  pull_request:
    paths:
      - scripts/install-mac.sh
      - .github/workflows/install-mac-smoke.yml
  push:
    branches: [main]
    paths:
      - scripts/install-mac.sh
      - .github/workflows/install-mac-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-14
    env:
      # Point the developer tools at a folder that does not exist, so every
      # Xcode stub (python3, git, xcodebuild) fails the way a broken Xcode does.
      DEVELOPER_DIR: /nonexistent/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Prove the developer tools are broken on this runner
        run: |
          if /usr/bin/python3 -c 'print(1)'; then
            echo "ERROR: /usr/bin/python3 still works, so this run does not reproduce a Mac with broken developer tools."
            exit 1
          fi
          echo "OK: /usr/bin/python3 fails, as on a Mac with broken developer tools."

      - name: Prove the report encoder on this Mac
        # install-mac.sh builds its JSON strings with JavaScript for Automation. Fed every control byte, quotes,
        # backslashes and non-ASCII text, the result must parse in an independent parser (Ruby's JSON library:
        # /usr/bin/ruby is a real system binary, not an Xcode stub, so it works on this broken-tools runner), and
        # when osascript fails no report may be sent at all.
        run: |
          eval "$(sed -n '/^json_string() {/,/^}/p' scripts/install-mac.sh)"
          ctl=""
          for ((i = 1; i < 32; i++)); do printf -v c "$(printf '\\%03o' "$i")"; ctl="$ctl$c"; done
          sample="$(printf 'quote " backslash \\ two \\\\ slash / utf8 caf\303\251 home %s ctl[%s] end' "$HOME" "$ctl")"
          printf '{"x":%s}' "$(json_string "$sample")" > "$RUNNER_TEMP/report.json"
          /usr/bin/ruby -rjson -e '
            v = JSON.parse(File.read(ARGV[0]))["x"]
            expected_controls = (1..31).map { |i| i.chr }.join
            abort("ERROR: the home folder was not reduced to ~, or the text did not round-trip: #{v.inspect}") unless v.include?("home ~ ctl[" + expected_controls + "] end")
            abort("ERROR: quotes or backslashes did not round-trip: #{v.inspect}") unless v.include?("quote \" backslash \\ two \\\\ slash / utf8 café home")
            puts "OK: parsed back #{v.length} characters; every control byte, quotes, backslashes and non-ASCII text intact."
          ' "$RUNNER_TEMP/report.json"
          eval "$(sed -n '/^report_step() {/,/^}/p' scripts/install-mac.sh)"
          fake="$RUNNER_TEMP/fakebin"; mkdir -p "$fake"
          printf '#!/bin/bash\nexit 1\n' > "$fake/osascript"
          printf '#!/bin/bash\ntouch "%s/curl-was-called"\n' "$RUNNER_TEMP" > "$fake/curl"
          chmod +x "$fake"/*
          if STEP=test LOG_FILE="" GATEWAY_URL=http://127.0.0.1:9 PATH="$fake:$PATH" report_step "hello"; then
            echo "ERROR: report_step succeeded although osascript failed."; exit 1
          fi
          if [[ -e "$RUNNER_TEMP/curl-was-called" ]]; then
            echo "ERROR: curl was called although the JSON could not be built."; exit 1
          fi
          echo "OK: when osascript fails, no report is sent."

      - name: Run the installer
        # The hosted Gateway is pointed at a closed local port: the script now reports what it did to
        # DevThrottle, and a runner's install is not a user's. The report must fail fast and quietly here.
        run: DEVTHROTTLE_NO_OPEN=1 DEVTHROTTLE_HOSTED_GATEWAY_URL=http://127.0.0.1:9 bash scripts/install-mac.sh

      - name: Check the wizard was installed
        run: |
          app="$HOME/Applications/DevThrottle Setup.app"
          [[ -d "$app" ]] || { echo "ERROR: $app was not installed."; exit 1; }
          echo "OK: $app is installed."
