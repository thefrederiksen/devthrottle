name: Deploy hosted Gateway

# Ships the hosted Gateway container to Azure App Service (devthrottle-gw) ONLY when a human (or an
# agent acting for one) deliberately starts it - never automatically on a push. Releasing the live
# Gateway is a separate, chosen act: we commit to main frequently, but updating production happens
# only when someone runs this workflow. Start it from the GitHub Actions UI ("Run workflow") or with
# `gh workflow run deploy-hosted-gateway.yml`; both are the same manual trigger.
#
# It REDEPLOYS via a WARMED SLOT SWAP: rebuild the image -> pin it on the STAGING slot and fully warm it
# (boot + EF migrations + JIT, with no user on it) -> swap staging into production behind the platform
# warmup gate -> measure the true external outage -> stop staging. The old instance keeps serving until
# the new one is proven healthy, so the user-facing outage is a few seconds of hand-off, not the ~95s of
# an in-place stop-start restart. It does NOT provision resources or set app settings (the resource group,
# ACR, plan, storage mount, the staging slot and the CC_GATEWAY_DB_CONNECTION are already provisioned - see
# provision-hosted-gateway-slots.yml and docs/architecture/step3-azure-deploy in devthrottle_internal - and
# persist across deploys), so this workflow needs NO stored secrets - only an Azure OIDC federated login as
# the devthrottle-hosted-gateway service principal.
#
# Requires the staging slot to exist (run provision-hosted-gateway-slots.yml once). If a swap ships bad
# code, rollback-hosted-gateway.yml swaps the previous instance back in seconds.
#
# Auth is OIDC (workload identity federation): no client secret is stored in this PUBLIC repo. The
# service principal (Contributor on the subscription) trusts a federated credential scoped to this
# repo's "hosted-gateway-production" environment. One-time setup is in the repo's deploy runbook.
#
# Runs on ubuntu-latest on purpose: the Azure CLI's build-log renderer crashes on a Windows host
# (colorama cp1252 cannot encode the U+2713 the build prints); on Linux it streams cleanly and
# `az acr build` blocks until the remote build finishes, so no polling workaround is needed here.
#
# TWO JOBS, ON PURPOSE. `deploy` does everything that CHANGES Azure and holds the serialisation group
# for that long (plus the few seconds it takes to hand its poll record over); `watch` is the ten-minute
# post-swap observation and holds nothing. See the
# comment on the group below - the split is what lets an emergency rollback start while the watch runs.

on:
  # Manual only. A human (or an agent) starts a release deliberately - from the Actions UI or via
  # `gh workflow run`. Nothing here deploys on a push; committing to main never touches production.
  # The branch/tag picked when starting the run is the commit that ships.
  workflow_dispatch:

permissions:
  id-token: write   # required for the Azure OIDC login
  contents: read
  checks: read      # required to read the shipping commit's check runs (the green-only gate)

env:
  AZURE_RG: rg-devthrottle-hosted-gateway
  ACR: crdevthrottlehg
  APP: devthrottle-gw
  IMAGE_NAME: devthrottle-gateway
  SLOT: staging
  GATEWAY_URL: https://devthrottle-gw.azurewebsites.net
  STAGING_URL: https://devthrottle-gw-staging.azurewebsites.net

jobs:
  deploy:
    name: Build image and deploy via warmed slot swap
    runs-on: ubuntu-latest
    environment: hosted-gateway-production

    # SERIALISATION. Everything that touches the live hosted Gateway - this deploy, the rollback
    # (rollback-hosted-gateway.yml) and the slot provisioning/cleanup (provision-hosted-gateway-slots.yml)
    # - shares the ONE group named below. Only one of them can run at a time; another that arrives while
    # it is running waits. Note the limit, so nobody reads more into this than it gives: GitHub keeps at
    # most ONE waiting member per group, so if a third contender is dispatched while one is already
    # waiting, the one that was waiting is cancelled rather than queued behind it. This is GitHub's
    # documented behaviour, not something measured here. It is not a deep queue - it is a mutual exclusion
    # lock with a one-slot waiting room.
    #
    # Why one group and not one per workflow: production and staging mount the SAME Azure Files share at
    # /home/gateway/cc-director, so any two of these running at once puts two containers on one set of
    # files. On 2026-07-30 a swap overlapped two containers for 144 seconds, which corrupted the SQLite
    # statistics database on that share; GET /sessions then returned HTTP 500 for 32 minutes across the
    # Cockpit, the phone and the command line. Every previous deploy had been rolling the same dice.
    # A deploy racing a rollback, or a deploy racing the provisioning job that starts and stops the
    # staging slot, is the same hazard with more moving parts.
    #
    # Why cancel-in-progress is FALSE. A second release WAITS for the one in flight; it must never cancel
    # it (issue #2222). This used to be true, on the reasoning that the cancel is safe during the
    # ~5-minute build because nothing live has changed yet. That reasoning only holds if the cancel
    # lands during the build, and there is no way to promise it does. On 2026-07-27 one landed INSIDE
    # "Deploy the new image to the staging slot and warm it" - after the staging slot had been started
    # and before anything could stop it. The stop step is skipped on a cancelled run, so the slot was
    # abandoned RUNNING: two Gateway containers on one worker for ten minutes, unattended, with the app
    # degraded the whole time. No probe failed and /healthz never dropped, so nothing caught it.
    # Cancelling a half-finished swap is worse than queueing behind it.
    #
    # Waiting costs a few minutes of build time. Cancelling costs an abandoned slot and a degraded
    # production service. Queue.
    #
    # WHY THE GROUP IS DECLARED HERE, ON THE JOB, AND NOT ON THE WORKFLOW. Declared at workflow level it
    # was held for the ENTIRE run, including the ten-minute post-swap watch - a stretch that changes
    # nothing in Azure and only reads. An emergency swap-back started during that watch therefore queued
    # behind ten minutes of pure observation, and the written workaround was for a human to go and cancel
    # the deploy run in the Actions user interface first. That is unacceptable for the emergency brake:
    # a rollback is used exactly when the fleet is already down, and on 2026-07-30 a rollback taking four
    # minutes instead of sixty-seven seconds was itself a filed defect, because someone had to stop and
    # read documentation while the fleet was blind.
    #
    # So the group covers this job, which is every step that MUTATES - build, the refusal check, starting
    # and warming the staging slot, the swap, and the settle step that stops staging again (plus its
    # always() safety net). The passive watch lives in the `watch` job below, which is deliberately NOT
    # in the group. While anything dangerous is happening a rollback still queues, which is right. Once the
    # last mutation is done this job only has to hand its poll record to the watch job - a few seconds of
    # artifact upload - and then the group is released and a rollback runs immediately. The ten minutes of
    # observation are no longer inside the lock; that is the whole change.
    #
    # Note the case this helps most: when the settle step FAILS it deliberately leaves the staging slot
    # RUNNING as the instant swap-back instance and exits non-zero. That is precisely the moment a
    # rollback is most urgent, and it is also the moment this job ends and releases the group.
    #
    # NOT DONE, and deliberately: making the rollback cancel the deploy. Cancelling a deploy mid-swap can
    # leave an Azure swap completing server-side while the rollback issues a reverse swap - two swap
    # operations racing - and a cancelled deploy can abandon the staging slot RUNNING, a permanent second
    # writer on the shared file share, which is what happened on 2026-07-27. cancel-in-progress stays
    # false in all three workflows.
    concurrency:
      group: hosted-gateway-production
      cancel-in-progress: false

    # Handed to the `watch` job, which runs on a different runner and so shares nothing else with this one.
    outputs:
      short: ${{ steps.short.outputs.short }}
      build_seconds: ${{ steps.build.outputs.build_seconds }}
      outgoing_commit: ${{ steps.outgoing.outputs.commit }}
      readiness_outcome: ${{ steps.readiness.outputs.outcome }}
      swap_outage_seconds: ${{ steps.readiness.outputs.swap_outage_seconds }}
      time_to_healthy_seconds: ${{ steps.readiness.outputs.time_to_healthy_seconds }}

    steps:
      # Check out the exact commit the run was started against (the branch/tag chosen in the UI, or
      # the ref `gh workflow run` was given). That commit is what gets built and shipped.
      - uses: actions/checkout@v5

      - name: Short SHA
        id: short
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # ---- THE TWO GATES ON WHAT MAY REACH PRODUCTION ------------------------------------------
      # This workflow is the ONLY supported way to update the live Gateway, so the conditions on what
      # it will ship are the conditions on what can reach production at all. Both refusals are here,
      # BEFORE the Azure login and the build, so a refused deploy costs seconds and touches nothing.
      #
      # 1. MAIN ONLY. workflow_dispatch will happily run against any branch or tag the caller picks,
      #    which meant an unreviewed branch could be built and swapped into production without ever
      #    having been merged. Production ships what is on main, or it does not ship.
      - name: Refuse to deploy anything but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "REFUSED: this run was started against '$GITHUB_REF'."
            echo "The live Gateway ships main and only main. Merge the change first, then deploy main."
            exit 1
          fi
          echo "Ref check passed: deploying refs/heads/main at ${{ steps.short.outputs.short }}."

      # 2. NOTHING RED. Nothing previously checked that the commit being shipped had passing tests -
      #    a red commit on main was as deployable as a green one. Ask GitHub for this exact commit's
      #    check runs and refuse if any COMPLETED one did not pass.
      #
      #    A check that has NOT FINISHED is not a refusal, and this step does not wait for one. It
      #    lists the pending checks and carries on, because a pending check is an absence of
      #    information rather than evidence of a fault. A commit with no check runs at all is not
      #    refused either.
      #
      #    THIS COMMENT USED TO SAY THE OPPOSITE, for twenty-five days after the code below stopped
      #    agreeing with it. It claimed a commit whose checks had not finished was "also refused",
      #    which was true only until #2406 ("stop the gate waiting for CI - refuse a FAILED check,
      #    never a pending one") landed on 2026-08-02 and left the prose behind. A stale comment
      #    directly above the code it describes is worse than none: it was read as the contract, and
      #    it sent deploys to the back of an hour of .NET CI that this step never asked for. The step
      #    name is the short version - refuse a commit whose checks have FAILED - and the code below
      #    is the long one. Neither this comment nor the runbook outranks them.
      - name: Refuse to deploy a commit whose checks have FAILED
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)

          # THIS run's own jobs are check runs on the same commit and are necessarily still in progress,
          # so they must be excluded or the gate refuses itself. Exclude by RUN ID rather than by job
          # name: the name is a human string that will be edited one day, and the failure mode of an
          # out-of-date name here is a deploy that can never start.
          all=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" --paginate \
                  --jq '.check_runs[] | [.name, .status, (.conclusion // ""), (.details_url // "")] | @tsv')

          # EARLIER runs of THIS WORKFLOW on the same commit are not checks on the code either. A deploy
          # attempt that was cancelled (a later dispatch superseded it) or that refused (this very step)
          # leaves a completed, non-successful check run on the commit, and on 2026-09-15 two such
          # attempts poisoned each other in a circle: every new deploy of 13891211f saw the previous
          # attempt's job and refused. So every run of this workflow file on this commit is excluded,
          # found by RUN ID through the workflow-runs API - the same rule as above, extended from "this
          # run" to "this workflow". The workflow file path comes from GITHUB_WORKFLOW_REF, never from a
          # typed name.
          workflow_file=${GITHUB_WORKFLOW_REF#*/.github/workflows/}
          workflow_file=${workflow_file%@*}
          own_runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?head_sha=${sha}&per_page=100" \
                       --jq '.workflow_runs[].id')
          own_pattern="/actions/runs/${GITHUB_RUN_ID}/"
          for id in $own_runs; do own_pattern="${own_pattern}|/actions/runs/${id}/"; done
          echo "Excluding this workflow's own runs on ${sha}: ${GITHUB_RUN_ID} $(echo $own_runs)"

          others=$(printf '%s\n' "$all" \
                   | grep -Ev "${own_pattern}" || true)

          if [ -z "$others" ]; then
            echo "NOTE: commit ${sha} has no check runs of its own yet."
            echo "      That is NOT a refusal. Local verification is this repository gate; continuous"
            echo "      integration is the backstop that reports afterwards. Waiting an hour for it"
            echo "      before every deploy is the cost the owner has ruled out twice."
            echo "Check gate passed: nothing has failed on ${sha}."
            exit 0
          fi

          echo "Checks on ${sha}:"
          printf '%s\n' "$others" | awk -F'\t' '{ printf "  %s: %s %s\n", $1, $2, $3 }'

          # neutral and skipped are passes: a check that deliberately did not apply to this commit has
          # not failed it. Anything else completed and not successful is a refusal.
          failed=$(printf '%s\n' "$others" \
                   | awk -F'\t' '$2 == "completed" && $3 != "success" && $3 != "neutral" && $3 != "skipped" { print "  "$1" ("$3")" }')
          pending=$(printf '%s\n' "$others" \
                    | awk -F'\t' '$2 != "completed" { print "  "$1" ("$2")" }')

          if [ -n "$failed" ]; then
            echo "REFUSED: these checks did not pass on the commit being shipped:"
            printf '%s\n' "$failed"
            exit 1
          fi
          if [ -n "$pending" ]; then
            # NOT a refusal. A pending check is an ABSENCE of information, not evidence of a fault,
            # and blocking on it turned this gate into a mandatory hour before every deploy.
            echo "NOTE: these checks have not finished, and the deploy is NOT waiting for them:"
            echo "$pending"
          fi
          echo "Check gate passed: nothing has FAILED on ${sha}."

      - name: Azure login (OIDC, no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_GW_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_GW_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_GW_SUBSCRIPTION_ID }}

      # Build the image IN Azure from this checkout (Dockerfile at the repo root builds the C# Gateway
      # plus the mobile PWA and the React Cockpit, and runs the workspace typecheck). A per-commit tag
      # keeps builds distinguishable; the App Service is pinned by the resulting immutable DIGEST, never
      # the tag, so a rebuild always forces a real pull.
      - name: Build image in ACR
        id: build
        run: |
          start=$(date +%s)
          az acr build \
            --registry "$ACR" \
            --image "${IMAGE_NAME}:ci-${{ steps.short.outputs.short }}" \
            --build-arg COCKPIT_COMMIT="${{ steps.short.outputs.short }}" \
            .
          echo "build_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      - name: Read the built image digest
        id: digest
        run: |
          DIGEST=$(az acr repository show \
            --name "$ACR" \
            --image "${IMAGE_NAME}:ci-${{ steps.short.outputs.short }}" \
            --query digest --output tsv)
          case "$DIGEST" in
            sha256:*) echo "digest=$DIGEST" >> "$GITHUB_OUTPUT" ;;
            *) echo "ERROR: could not read a sha256 digest (got '$DIGEST')"; exit 1 ;;
          esac
          echo "Built digest: $DIGEST"

      # Read the commit the LIVE service is running BEFORE the swap - this is the OUTGOING build, and the
      # /healthz .commit field (added alongside this workflow) is what makes it readable. Used for two
      # things: the honest-readiness poll below tells "the new image is serving" apart from "the old
      # container is still answering 200" by commit, and the migration-delta step diffs OUTGOING..target.
      # Empty when the currently-live image predates the .commit field (only the very first deploy of this
      # change) - both consumers handle that honestly rather than guessing.
      - name: Read the outgoing (currently-live) commit
        id: outgoing
        run: |
          OUT=$(curl -s -m 15 "${GATEWAY_URL}/healthz" | jq -r '.commit // empty' 2>/dev/null || true)
          echo "commit=$OUT" >> "$GITHUB_OUTPUT"
          echo "Outgoing live commit: ${OUT:-<unknown - image predates the /healthz commit field>}"

      # Deploy the new image to the STAGING slot and fully warm it BEFORE any user sees it. Staging shares
      # the production configuration (same Supabase database, same storage) but has its own hostname, so
      # this is where the new image boots, runs its EF migrations, and JIT-warms with zero user impact. If
      # anything here fails, production is untouched and still serving the old image - the deploy aborts
      # safely. Staging is normally STOPPED (steady state is one instance writing the shared mount), so we
      # point it at the new digest and start it.
      # REFUSE to start on a dirty slot (issue #2222). Steady state is staging STOPPED - one instance
      # writing the shared mount. If it is already running, a previous run died without cleaning up, and
      # starting a deploy on top of that means three containers contending instead of two. Fail here,
      # where nothing has been touched, rather than discovering it after the swap.
      #
      # The one legitimate exception is the deploy that deliberately LEAVES staging running for swap-back
      # (see the settle step below). That case needs a human to decide whether to roll back or proceed, so
      # it is correct for this to stop and say so rather than guess.
      - name: Refuse to deploy onto a staging slot that is already running
        run: |
          STATE=$(az webapp show --resource-group "$AZURE_RG" --name "$APP" --slot "$SLOT" --query state --output tsv)
          echo "Staging slot state: $STATE"
          if [ "$STATE" != "Stopped" ]; then
            echo "ERROR: the staging slot is '$STATE', expected 'Stopped'."
            echo "       Steady state is one running instance. A running staging slot means either a"
            echo "       previous deploy died without cleaning up (see issue #2222), or a deploy"
            echo "       deliberately left it running so rollback-hosted-gateway could swap back."
            echo "       Decide which, then either run the rollback or stop the slot by hand:"
            echo "         az webapp stop -g $AZURE_RG -n $APP --slot $SLOT"
            echo "       Nothing has been changed by this run."
            exit 1
          fi

      - name: Deploy the new image to the staging slot and warm it
        id: warm
        run: |
          TARGET="${{ steps.short.outputs.short }}"
          REF="${ACR}.azurecr.io/${IMAGE_NAME}@${{ steps.digest.outputs.digest }}"
          az webapp config container set --resource-group "$AZURE_RG" --name "$APP" --slot "$SLOT" \
            --docker-custom-image-name "$REF" --output none
          az webapp start --resource-group "$AZURE_RG" --name "$APP" --slot "$SLOT" --output none
          echo "Staging pinned to $REF and started; warming until it serves commit $TARGET..."

          # Poll the STAGING hostname until it answers 200 with the new commit, sustained 3 times: proof the
          # new image booted and migrated cleanly. No user is on staging, so this costs no outage.
          # up_since marks when staging first started answering 200. If it serves 200 but never reports the
          # shipped commit, that is not a slow boot - it is the wrong image or a missing COCKPIT_COMMIT in the
          # runtime image, so fail FAST with that diagnosis instead of burning the whole boot timeout.
          streak=0
          up_since=""
          deadline=$(( $(date +%s) + 600 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            body=$(curl -s -m 10 -w '\n%{http_code}' "${STAGING_URL}/healthz" 2>/dev/null || printf '\n000')
            code=$(printf '%s' "$body" | tail -n1)
            commit=$(printf '%s' "$body" | sed '$d' | jq -r '.commit // empty' 2>/dev/null || echo "")
            if [ "$code" = "200" ] && [ "$commit" = "$TARGET" ]; then
              streak=$(( streak + 1 )); echo "staging 200 commit=$commit (streak $streak)"
              [ "$streak" -ge 3 ] && break
            else
              streak=0; echo "staging HTTP $code commit=${commit:-<none>} (warming)"
              if [ "$code" = "200" ]; then
                [ -z "$up_since" ] && up_since=$(date +%s)
                if [ $(( $(date +%s) - up_since )) -gt 150 ]; then
                  echo "ERROR: staging has served 200 for over 150s but never reports commit $TARGET (got"
                  echo "       '${commit:-<none>}'). The running image is not the shipped build, or the runtime"
                  echo "       image does not carry COCKPIT_COMMIT. Aborting before the swap; production untouched."
                  echo "outcome=failed" >> "$GITHUB_OUTPUT"
                  exit 1
                fi
              fi
            fi
            sleep 3
          done
          if [ "$streak" -lt 3 ]; then
            echo "ERROR: staging never served a sustained 200 on commit $TARGET - aborting before the swap."
            echo "outcome=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Staging warm and healthy on $TARGET."

      # Swap the warmed staging instance into production, MEASURING the true external outage the way a user
      # experiences it. The swap is a warmed hand-off: the old instance keeps serving until the platform's
      # warmup gate (WEBSITE_SWAP_WARMUP_PING_PATH=/healthz) confirms the incoming instance is healthy, then
      # the front door cuts over. `az ... slot swap` BLOCKS until the swap completes, so we start a
      # background poller on the PRODUCTION url FIRST and let it run across the cutover, then measure the gap
      # between the last 200 on the old commit and the first 200 on the new commit. This is the number that
      # should now be seconds instead of ~95.
      - name: Swap into production and measure the external outage
        id: readiness
        run: |
          TARGET="${{ steps.short.outputs.short }}"
          LOG=/tmp/swap-poll.log; : > "$LOG"
          # The poller is deliberately NOT killed in this step. It keeps running across the settle check
          # below, because the outage this deploy actually causes happens MINUTES after the swap returns
          # (issue #2203): the platform starts a fresh production container with the swapped configuration,
          # that container fails to bind its port, and the platform stops the SITE. A window that closes
          # 8 seconds after the swap always measured 0.0s and always missed it.
          # It is stopped at the end of this job and its log handed to the `watch` job as an artifact, which
          # resumes polling and joins the two records. See "Hand the production poll record to the watch job".
          # SAMPLE FAST (issue #2383). The bar this deploy is judged against is a ONE-SECOND outage, and
          # an instrument that samples once a second cannot resolve it: a gap shorter than the interval
          # falls entirely between two samples and reads as a clean 0.0s. That is a null result being
          # mistaken for proof, and it is the difference between "we measured no outage" and "we could
          # not have seen one". The cadence is the sleep PLUS the request round trip plus the process
          # spawns below, so it is not 0.1s in practice - which is exactly why the analysis step measures
          # the ACHIEVED interval from these timestamps and prints it beside the verdict. A run that could
          # not resolve the bar says so itself rather than presenting a confident zero.
          ( while :; do
              t=$(date +%s.%N)
              body=$(curl -s -m 2 -w '\n%{http_code}' "${GATEWAY_URL}/healthz" 2>/dev/null || printf '\n000')
              code=$(printf '%s' "$body" | tail -n1)
              commit=$(printf '%s' "$body" | sed '$d' | jq -r '.commit // empty' 2>/dev/null || echo "")
              echo "$t $code ${commit:-none}" >> "$LOG"
              sleep 0.1
            done ) & POLL=$!
          echo "$POLL" > /tmp/swap-poll.pid

          t_deploy=$(date +%s)
          az webapp deployment slot swap --resource-group "$AZURE_RG" --name "$APP" \
            --slot "$SLOT" --target-slot production --output none
          echo "Swap complete; sampling a few more seconds to catch the first sustained new-commit..."
          sleep 8

          echo "--- production poll across the swap ---"; cat "$LOG"
          # last 200 whose commit is NOT the new one (old instance serving), and first 200 on the new commit.
          last_old=$(awk -v t="$TARGET" '$2=="200" && $3!=t {print $1}' "$LOG" | tail -n1)
          first_new=$(awk -v t="$TARGET" '$2=="200" && $3==t {print $1; exit}' "$LOG")
          if [ -z "$first_new" ]; then
            echo "ERROR: production never served the new commit $TARGET after the swap."
            echo "outcome=failed" >> "$GITHUB_OUTPUT"; exit 1
          fi
          if [ -n "$last_old" ]; then
            outage=$(awk -v a="$last_old" -v b="$first_new" 'BEGIN{d=b-a; if(d<0)d=0; printf "%.1f", d}')
          else
            outage=0
          fi
          tth=$(( $(printf '%.0f' "$first_new") - t_deploy ))
          echo "swap_outage_seconds=$outage" >> "$GITHUB_OUTPUT"
          echo "time_to_healthy_seconds=$tth" >> "$GITHUB_OUTPUT"
          echo "outcome=healthy" >> "$GITHUB_OUTPUT"
          echo "New image ${TARGET} live in production. Gap ACROSS THE SWAP ITSELF ~${outage}s."
          echo "This is NOT the deploy's outage - the post-swap watch job measures that."
          curl -s -m 15 "${GATEWAY_URL}/healthz"; echo

      # Return to steady state (one running instance) ONLY after production has proven itself STABLY healthy
      # on the new commit. Stopping the staging slot two seconds after the swap - while the just-swapped
      # production container was still settling - is what took production down (a 502 outage that needed a
      # manual swap-back). On a single-instance plan both slots share one worker, so a stop of one slot can
      # disturb the other; it is only safe once production is solidly up. Require ~45s of an unbroken streak
      # of clean external 200s on the new commit first. If production does NOT stabilize, LEAVE staging
      # running (it is the instant swap-back instance) and fail loudly so the release is not treated as good.
      #
      # This is the last step that changes Azure on the SUCCESS path; the always() safety net below is the
      # only other writer, and it writes solely when this step did not run. Everything after those two only
      # reads, and the whole watch lives in a separate ungrouped job, so the serialisation group is released
      # within seconds of this step finishing - including when it FAILS and leaves staging as the swap-back
      # instance, which is exactly the moment a rollback is most urgent.
      - name: Confirm production is stable, then stop staging
        id: settle
        run: |
          TARGET="${{ steps.short.outputs.short }}"
          need=15; streak=0; deadline=$(( $(date +%s) + 150 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            body=$(curl -s -m 5 -w '\n%{http_code}' "${GATEWAY_URL}/healthz" 2>/dev/null || printf '\n000')
            code=$(printf '%s' "$body" | tail -n1)
            commit=$(printf '%s' "$body" | sed '$d' | jq -r '.commit // empty' 2>/dev/null || echo "")
            if [ "$code" = "200" ] && [ "$commit" = "$TARGET" ]; then
              streak=$(( streak + 1 )); echo "production stable 200 commit=$commit ($streak/$need)"
              [ "$streak" -ge "$need" ] && break
            else
              streak=0; echo "production HTTP $code commit=${commit:-<none>} (waiting for a stable streak)"
            fi
            sleep 3
          done
          if [ "$streak" -lt "$need" ]; then
            echo "ERROR: production did not hold a stable streak on $TARGET after the swap. Leaving the staging"
            echo "       slot RUNNING so rollback-hosted-gateway (swap-back) can recover instantly. Do not"
            echo "       deploy again until this is understood."
            echo "stopped_staging=no" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Production held a stable streak on $TARGET; stopping the staging slot."
          az webapp stop --resource-group "$AZURE_RG" --name "$APP" --slot "$SLOT" --output none
          echo "stopped_staging=yes" >> "$GITHUB_OUTPUT"

      # The safety net (issue #2222). A run that dies anywhere between starting the staging slot and the
      # settle step leaves that slot RUNNING, and a second Gateway container on the worker degrades the
      # live service until someone notices. `always()` covers cancellation as well as failure, which is
      # the case that actually bit us.
      #
      # It reads the settle step's own verdict and does NOT second-guess it:
      #   stopped_staging=yes  -> settle already stopped it; nothing to do.
      #   stopped_staging=no   -> settle DELIBERATELY left it running as the swap-back instance. Leave it.
      #                           Stopping it here would destroy the rollback path.
      #   <empty>              -> settle never ran, so nobody owns the slot. Stop it.
      # This is a second line of defence, not the primary fix - a cancelled job is not guaranteed to
      # finish its steps. The primary fix is cancel-in-progress: false above.
      #
      # This is the only step after `settle` that can still write to Azure, which is why it is inside the
      # grouped job rather than in the watch job.
      - name: Always leave the staging slot stopped unless it is the swap-back instance
        if: always()
        run: |
          VERDICT="${{ steps.settle.outputs.stopped_staging }}"
          if [ "$VERDICT" = "yes" ]; then
            echo "Staging was already stopped by the settle step; nothing to clean up."
            exit 0
          fi
          if [ "$VERDICT" = "no" ]; then
            echo "Staging is DELIBERATELY left running as the swap-back instance - not touching it."
            exit 0
          fi
          STATE=$(az webapp show --resource-group "$AZURE_RG" --name "$APP" --slot "$SLOT" --query state --output tsv 2>/dev/null || echo Unknown)
          echo "This run never reached the settle step. Staging slot state: $STATE"
          if [ "$STATE" = "Stopped" ]; then
            echo "Already stopped - nothing to clean up."
            exit 0
          fi
          echo "Stopping the abandoned staging slot so production is not left sharing its worker."
          az webapp stop --resource-group "$AZURE_RG" --name "$APP" --slot "$SLOT" --output none
          echo "Staging stopped."

      # The watch job runs on a DIFFERENT runner, so it cannot see this runner's /tmp or reach into the
      # background poller. Stop the poller and hand its log over as an artifact; the watch job starts its
      # own poller and joins the two records into one timeline. The samples carry absolute epoch
      # timestamps, so joining them is concatenation in order, not a guess.
      - name: Hand the production poll record to the watch job
        id: handover
        if: always() && steps.readiness.outputs.outcome == 'healthy'
        run: |
          # The poller is a child of the readiness step's shell, not this one, so `wait` cannot reap it.
          # Signal it and then watch the process actually disappear before reading the log, otherwise the
          # last sample can be half-written when it is uploaded.
          if [ -f /tmp/swap-poll.pid ]; then
            P=$(cat /tmp/swap-poll.pid)
            kill "$P" 2>/dev/null || true
            gone=no
            for _ in $(seq 1 50); do
              if kill -0 "$P" 2>/dev/null; then sleep 0.2; else gone=yes; break; fi
            done
            if [ "$gone" != "yes" ]; then
              echo "WARNING: the swap poller (pid $P) did not exit within 10s of SIGTERM. The record uploaded"
              echo "         below may have a truncated final sample. The watch job joins this file to its own"
              echo "         samples, so treat the seam as unreliable rather than assuming it is clean."
            fi
          fi
          wc -l /tmp/swap-poll.log
          echo "Last sample handed over: $(tail -n1 /tmp/swap-poll.log)"

      - name: Upload the production poll record
        if: always() && steps.readiness.outputs.outcome == 'healthy'
        uses: actions/upload-artifact@v4
        with:
          name: swap-poll-log
          path: /tmp/swap-poll.log
          if-no-files-found: error

  # The passive half. It changes NOTHING in Azure - it polls /healthz, reads the site state, diffs the
  # migration set in git, and writes a report. It is deliberately outside the serialisation group so that
  # an emergency rollback started during these ten minutes runs immediately instead of queueing behind an
  # observation. `if: always()` so a deploy that failed before the swap still gets its metrics row.
  watch:
    name: Watch production past the swap and report
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    environment: hosted-gateway-production

    steps:
      # FIRST, before checkout or login: resume polling production as quickly as this runner allows. The
      # deploy job's poller died with that runner, so there is an unavoidable unpolled gap between the two
      # jobs - runner provisioning, roughly ten to thirty seconds. Starting here rather than after the
      # setup steps keeps that gap as small as a job boundary permits. The gap is declared, not hidden:
      # the joined record below cannot see an outage that begins and ends inside it.
      - name: Resume polling production immediately
        if: needs.deploy.outputs.readiness_outcome == 'healthy'
        run: |
          LOG=/tmp/watch-poll.log; : > "$LOG"
          # SAMPLE FAST (issue #2383). The bar this deploy is judged against is a ONE-SECOND outage, and
          # an instrument that samples once a second cannot resolve it: a gap shorter than the interval
          # falls entirely between two samples and reads as a clean 0.0s. That is a null result being
          # mistaken for proof, and it is the difference between "we measured no outage" and "we could
          # not have seen one". The cadence is the sleep PLUS the request round trip plus the process
          # spawns below, so it is not 0.1s in practice - which is exactly why the analysis step measures
          # the ACHIEVED interval from these timestamps and prints it beside the verdict. A run that could
          # not resolve the bar says so itself rather than presenting a confident zero.
          ( while :; do
              t=$(date +%s.%N)
              body=$(curl -s -m 2 -w '\n%{http_code}' "${GATEWAY_URL}/healthz" 2>/dev/null || printf '\n000')
              code=$(printf '%s' "$body" | tail -n1)
              commit=$(printf '%s' "$body" | sed '$d' | jq -r '.commit // empty' 2>/dev/null || echo "")
              echo "$t $code ${commit:-none}" >> "$LOG"
              sleep 0.1
            done ) & echo "$!" > /tmp/watch-poll.pid
          echo "Watch-side poller started at $(date -u +%H:%M:%S)."

      # Needed for the migration diff and for the full SHA in the metrics report.
      - uses: actions/checkout@v5

      - name: Download the production poll record from the deploy job
        if: needs.deploy.outputs.readiness_outcome == 'healthy'
        uses: actions/download-artifact@v4
        with:
          name: swap-poll-log
          path: /tmp/deploy-poll

      - name: Azure login (OIDC, no stored secret)
        if: needs.deploy.outputs.readiness_outcome == 'healthy'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_GW_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_GW_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_GW_SUBSCRIPTION_ID }}

      # KEEP WATCHING. This is the step that measures the outage a user actually gets (issue #2203).
      #
      # Every deploy on 2026-07-26 reported 0.0s and every one of them took the live service down two to
      # four minutes LATER, long after the job used to finish. The mechanism: after the swap the platform
      # starts a fresh production container with the swapped configuration; that container's application
      # starts but never binds its port; the platform's startup probe correctly finds nothing, gives up,
      # and puts the SITE into Stopped. Two of the three were caught only because someone happened to be
      # polling by hand.
      #
      # Two things are watched, because neither alone is enough.
      #
      # CORRECTION (issue #2383). This comment used to claim the site state was "the earlier and truer
      # signal". It is not, and trusting it would have hidden the worst outage we have had. On 2 August
      # the platform genuinely stopped the site for 21 seconds - 12:57:49 to 12:58:10, spanning a sample
      # at 12:57:50 - and EVERY site-state sample still read `Running`. The reason is that
      # `az webapp show --query state` reports the DESIRED state in Azure Resource Manager (has anyone
      # deliberately stopped this site), not whether a container is up. It cannot see a
      # platform-initiated stop, which is the failure that actually takes production down.
      #
      # The EXTERNAL POLL is the signal that caught it, and it is the one the budget is judged on. The
      # site-state sample stays because it is the only thing that catches a deliberate stop, and it costs
      # nothing - but it is the weaker of the two and must not be read as a clean bill of health.
      # `az webapp show` READS; nothing in this step writes.
      - name: Watch production past the swap and measure the true outage
        id: outage
        if: needs.deploy.outputs.readiness_outcome == 'healthy'
        env:
          WATCH_SECONDS: '600'
          # TEN. Owner ruling 2026-08-20: "if the time gets over 10 seconds, then we start dealing
          # with it."
          #
          # This was FIVE, on the reasoning that a healthy deploy costs about zero because three
          # earlier runs each measured "Longest unavailable stretch: 0.0s". That reasoning conflated
          # two different numbers, and measurement has since separated them:
          #
          #   swap_window_gap_seconds   - the cutover itself. Still 0.0s. The warmed hand-off works.
          #   external_outage_seconds   - what a caller experiences across the WHOLE watch, which also
          #                               covers the spare slot starting and the old slot stopping.
          #                               Both slots share one worker, so that churn disturbs
          #                               production whether or not the app is quick to boot.
          #
          # The zero readings were the first number. The second measured 6.7s on 2026-08-19 (run
          # 32280188992) and 6.6s on 2026-08-20 (run 32321987703) - two consecutive HEALTHY deploys,
          # one of them carrying the change that moved the database open behind the port bind, which
          # did not shift it. So ~6-7s is what a good deploy costs here, not a sign of a failed
          # hand-off.
          #
          # At five, every deploy failed, and a gate that is always red cannot tell 6.6s from the
          # 38.5s (#2383) and 46.7s (#2585) outages it exists to catch - which is the whole reason
          # thirty was rejected. Ten passes a normal deploy and still fails those two loudly.
          #
          # This is a REPORTING threshold, not a promise: exceeding it fails the run after the fact.
          # It has never prevented an outage and does not now.
          MAX_ACCEPTABLE_OUTAGE_SECONDS: '10'
        run: |
          STATE_LOG=/tmp/site-state.log; : > "$STATE_LOG"
          echo "Watching for ${WATCH_SECONDS}s past the swap (the failure window is 2-4 minutes out)..."

          deadline=$(( $(date +%s) + WATCH_SECONDS ))
          bad_state=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            st=$(az webapp show --resource-group "$AZURE_RG" --name "$APP" --query state --output tsv 2>/dev/null || echo "Unknown")
            echo "$(date -u +%H:%M:%S) $st" >> "$STATE_LOG"
            if [ "$st" != "Running" ]; then
              bad_state="$st"
              echo "SITE STATE LEFT Running: $st at $(date -u +%H:%M:%S)"
            fi
            sleep 15
          done

          # Stop this job's poller, then join the deploy job's record to it. Both carry absolute epoch
          # timestamps and the deploy job's samples all precede this job's, so ordering is by construction.
          # The poller belongs to an earlier step's shell, so `wait` cannot reap it - signal it and watch
          # the process actually go, or the join can catch a half-written final sample.
          if [ -f /tmp/watch-poll.pid ]; then
            P=$(cat /tmp/watch-poll.pid)
            kill "$P" 2>/dev/null || true
            gone=no
            for _ in $(seq 1 50); do
              if kill -0 "$P" 2>/dev/null; then sleep 0.2; else gone=yes; break; fi
            done
            if [ "$gone" != "yes" ]; then
              echo "WARNING: the watch poller (pid $P) did not exit within 10s of SIGTERM. The joined record"
              echo "         below may be missing or splitting its final sample. Treat the last second of the"
              echo "         timeline as unreliable rather than assuming it is clean."
            fi
          fi
          LOG=/tmp/swap-poll.log
          cat /tmp/deploy-poll/swap-poll.log /tmp/watch-poll.log > "$LOG"

          # DID SOMETHING SWAP UNDERNEATH US? This watch no longer holds the serialisation group, which is
          # the entire point of the split - so a rollback (or the provisioning job) can legitimately run
          # while it is watching. Availability alone cannot see that: a swap-back serves a clean 200 from
          # the OLD commit, so a watch that only counted 200s would report a healthy, un-rolled-back deploy
          # for a deploy that had just been rolled back. Read the commit, not just the status code.
          # It says SUPERSEDED, not "rolled back", because the evidence only shows that production stopped
          # serving what this run deployed. A swap-back is the expected cause, but a newer deploy would look
          # the same, and naming the evidence after the most likely cause is how a guess becomes a record.
          # (The metrics field is still called "rollback" so the deploy ledger's columns do not shift; its
          # VALUES are the honest ones - superseded-during-watch / no / not-measured.)
          #
          # KNOWN BLIND SPOT: identity here is the commit, so redeploying the commit that is ALREADY live
          # cannot see a swap-back - the old and new instances report the same string. Such a run reports
          # superseded=no when the truthful answer is unanswerable. Telling them apart needs an identity
          # finer than the commit (a per-run build token in /healthz); until that exists, a same-commit
          # redeploy's supersession verdict is worth less than the others and this comment is the warning.
          TARGET="${{ needs.deploy.outputs.short }}"

          # Scan the WHOLE timeline, not just a final sample: once production has served TARGET, any later
          # SUSTAINED run of 200s carrying a different commit is the supersession. A single closing
          # request would miss a rollback that was itself swapped over again before the watch ended.
          # A "none" counts as a different commit - an image that reports no commit is not this deploy
          # either, and treating it as clean would hide exactly the swap this scan exists to catch.
          #
          # BOTH thresholds exist because ONE of them was not enough, and the run that proved it is
          # 31005677755 (2026-08-05). Arming after 3 consecutive TARGET samples was meant to sit past the
          # cutover, but the cutover is not a clean edge: for ~2.9 seconds the front door alternated
          # between the old instance and the new one, so the third consecutive TARGET landed INSIDE the
          # flap and the very next straggler from the old instance fired the verdict. That deploy was
          # healthy - production served TARGET solidly for the rest of the record and is serving it now -
          # and it was reported superseded. The 2026-08-03 run reported the same shape for the same reason.
          #
          # This is the expensive direction of wrong. A pipeline that cries rollback on healthy deploys
          # is a pipeline whose rollback verdict stops being read, and then a real rollback goes by
          # unnoticed. So the OTHER commit must now also be sustained - it is not enough to appear.
          #
          # 10 consecutive is ~1.5s at the observed median sample interval of 0.15s. The measured flap
          # never produced more than 2 consecutive samples from the old instance; a genuine swap-back
          # serves the old commit for the whole remainder of the watch (hundreds of samples), so it
          # clears this bar immediately. The gap between 2 and 10 is the margin, and it is deliberate:
          # missing a real swap-back by a second costs nothing (the run reports the closing commit too,
          # in the `serving` check below), while a false alarm costs the verdict's credibility.
          OTHER_RUN_REQUIRED=10
          other=$(awk -v t="$TARGET" -v need="$OTHER_RUN_REQUIRED" '
            !armed && $2=="200" && $3==t { run++; if (run >= 3) armed=1; next }
            !armed { run=0; next }
            # Armed. Count 200s carrying something other than the target. Only a 200 back ON the
            # target resets the count - an outage sample does NOT.
            #
            # That asymmetry is deliberate and was a review finding. Resetting on any non-200 sounds
            # equivalent and is not: a genuinely rolled-back instance that is also unhealthy serves the
            # old commit in runs of 200s separated by 503s, and under a reset-on-anything rule it could
            # do that for the entire watch without ever reaching the threshold - so the worst kind of
            # rollback, one that is both wrong AND failing, would be the one we stayed silent about.
            # The question this scan asks is "has production stopped serving what we deployed", and an
            # outage is not evidence that it resumed.
            armed && $2=="200" && $3==t { seen=0; next }
            armed && $2=="200" {
              seen++; last=($3=="" ? "none" : $3)
              if (seen >= need) { print last; exit }
              next
            }
            armed { next }
          ' "$LOG")
          serving=$(printf '%s' "$(curl -s -m 10 "${GATEWAY_URL}/healthz" 2>/dev/null)" | jq -r '.commit // empty' 2>/dev/null || echo "")
          echo "serving_commit_at_end=${serving}" >> "$GITHUB_OUTPUT"

          if [ "$other" = "none" ]; then
            # Something without commit metadata served production mid-watch. It is not this deploy, but the
            # sample cannot say what it was, so this is unanswerable rather than a clean bill.
            echo "superseded=unknown" >> "$GITHUB_OUTPUT"
            echo "NOTE: mid-watch, production served 200 with NO commit reported. That is not this deploy,"
            echo "      but the record cannot say what it was. Recorded as unknown, not as clean."
          elif [ -n "$other" ]; then
            echo "superseded=yes" >> "$GITHUB_OUTPUT"
            echo "NOTE: during the watch production served commit '${other}', not the deployed '${TARGET}'."
            echo "      Something swapped underneath this watch - a rollback (rollback-hosted-gateway.yml"
            echo "      swap-back) is the expected cause, but a newer deploy looks identical from here."
            echo "      The availability numbers below are still true; the code now live is NOT this deploy."
          elif [ -n "$serving" ] && [ "$serving" != "$TARGET" ]; then
            echo "superseded=yes" >> "$GITHUB_OUTPUT"
            echo "NOTE: production ended the watch serving commit '${serving}', not the deployed '${TARGET}'."
          elif [ -z "$serving" ]; then
            # The live image reports no commit at all. That is the documented first-deploy case (an image
            # predating the /healthz .commit field), and it makes supersession UNANSWERABLE from here - every
            # 200 looks the same whoever is serving it. Say unknown; do not bank an unmeasured "no".
            echo "superseded=unknown" >> "$GITHUB_OUTPUT"
            echo "NOTE: production reports no commit on /healthz, so this watch CANNOT tell whether the code"
            echo "      it deployed is still the code being served. Recorded as unknown, not as clean."
          else
            echo "superseded=no" >> "$GITHUB_OUTPUT"
          fi

          # The whole record, from before the swap to ten minutes after it. Compute the LONGEST unbroken
          # run of non-200 samples, in seconds, and the total. The poller samples about once a second, so a
          # gap is measured from the last good sample to the next good one.
          #
          # The join between the two jobs is a stretch with no samples at all, roughly ten to thirty
          # seconds. Two 200s either side of it read as continuous, so an outage contained entirely within
          # that stretch is invisible here. It sits about 75 to 120 seconds after the swap - before the 2-4
          # minute window this step exists to catch, but the numbers below are a floor, not a ceiling.
          read -r longest total start_of_longest <<EOF
          $(awk '
            $2=="200" {
              if (gap_start != "") { d = $1 - gap_start; total += d; if (d > longest) { longest = d; at = gap_start } ; gap_start = "" }
              last_good = $1; next
            }
            { if (gap_start == "") gap_start = (last_good != "" ? last_good : $1); last_seen = $1 }
            END {
              # Still unavailable when the watch ended: that stretch is the WORST case, not a zero.
              # Closing the books without it would report 0.0s for a service that never came back.
              if (gap_start != "") { d = last_seen - gap_start; total += d; if (d > longest) { longest = d; at = gap_start } }
              printf "%.1f %.1f %s", longest+0, total+0, (at == "" ? "-" : at)
            }
          ' "$LOG")
          EOF

          echo "--- site state samples ---"; cat "$STATE_LOG"
          echo "Longest unavailable stretch: ${longest}s   Total unavailable: ${total}s"

          # THE INSTRUMENT'S OWN RESOLUTION, reported beside the verdict (issue #2383). A measured outage
          # of 0.0s is a NULL result, and a null is only ever as strong as the instrument behind it: if the
          # samples were 1.2s apart, "no gap" cannot rule out a one-second outage - which is precisely the
          # bar this deploy is held to. So every run states the sampling interval it actually achieved, and
          # a run too coarse to resolve the bar says so instead of presenting a confident zero.
          #
          # No heredoc here on purpose: a heredoc terminator has to sit at column 0, which would end this
          # YAML block scalar early and break the whole workflow file.
          gaps=$(awk '{ if (p != "") printf "%.4f\n", $1 - p; p = $1 }' "$LOG" | sort -n)
          if [ -z "$gaps" ]; then
            # Fewer than two samples means there is no interval at all. That is not a fine resolution, it
            # is NO measurement, and it must never read as the healthy case - which is precisely the
            # confusion this reporting exists to prevent.
            echo "Sampling: $(wc -l < "$LOG" 2>/dev/null || echo 0) sample(s) - too few to measure an interval."
            echo "NOTE: the availability record is UNUSABLE for judging the one-second bar. Fewer than two"
            echo "      samples means no gap could have been observed at all."
            echo "sample_median_interval=unmeasured" >> "$GITHUB_OUTPUT"
            echo "sample_max_interval=unmeasured" >> "$GITHUB_OUTPUT"
          else
            samples=$(printf '%s\n' "$gaps" | wc -l); samples=$((samples + 1))
            med_gap=$(printf '%s\n' "$gaps" | awk '{ a[NR] = $1 } END { printf "%.3f", a[int((NR + 1) / 2)] }')
            max_gap=$(printf '%s\n' "$gaps" | awk 'END { printf "%.3f", $1 }')
            echo "Sampling: ${samples} samples, median interval ${med_gap}s, worst interval ${max_gap}s"
            echo "sample_median_interval=${med_gap}" >> "$GITHUB_OUTPUT"
            echo "sample_max_interval=${max_gap}" >> "$GITHUB_OUTPUT"
            if awk -v m="$max_gap" 'BEGIN { exit !(m > 1.0) }'; then
              echo "NOTE: the worst gap between samples was ${max_gap}s, which is COARSER than the one-second"
              echo "      bar. A 0.0s reading from this run does not rule out an outage shorter than that."
              echo "      The join between the deploy and watch jobs is the usual reason - it is a real hole"
              echo "      in the record, roughly ten to thirty seconds wide, and it is declared not hidden."
            else
              echo "Resolution is finer than the one-second bar, so a 0.0s reading is meaningful at that bar."
            fi
          fi
          echo "true_outage_seconds=$longest" >> "$GITHUB_OUTPUT"
          echo "total_unavailable_seconds=$total" >> "$GITHUB_OUTPUT"
          echo "site_state_left_running=${bad_state:-no}" >> "$GITHUB_OUTPUT"

          fail=""
          if [ -n "$bad_state" ]; then
            fail="the App Service site left the Running state (saw '$bad_state')"
          elif awk -v a="$longest" -v b="$MAX_ACCEPTABLE_OUTAGE_SECONDS" 'BEGIN{exit !(a > b)}'; then
            fail="production was unavailable for ${longest}s, over the ${MAX_ACCEPTABLE_OUTAGE_SECONDS}s budget"
          fi
          if [ -n "$fail" ]; then
            echo "ERROR: $fail."
            echo "       The deploy SHIPPED - this is not a rollback signal, it is the outage report the old"
            echo "       8-second window could not produce. See issue #2203. The failing container's own"
            echo "       startup log is in the platform container log for this app; the hosted Gateway now"
            echo "       mirrors its startup to standard output so that record is complete."
            echo "--- full production poll ---"; cat "$LOG"
            exit 1
          fi
          echo "Production stayed available for the full ${WATCH_SECONDS}s window past the swap."

      # PROVE THE PAGES WORK, NOT JUST THAT THE PROCESS ANSWERS.
      #
      # Everything above this point measures ONE thing: is there a Gateway on the other end of the port,
      # serving the commit we shipped. On 2 September 2026 the answer was yes for the whole watch window
      # and the release was still broken - Your Throttle answered 503 to every request for hours and the
      # owner's turns went unrecorded, because the container's statistics store lost a race for a database
      # connection while production and staging were both up, and nothing retried it. A green deploy and a
      # dead page, with no contradiction anywhere in this file, because nothing here had ever asked.
      #
      # /healthz now reports each subsystem that can be down on its own while the process serves. This step
      # asserts every one of them is up. It POLLS rather than asking once, because a subsystem is allowed
      # to come up after the port does - the statistics store publishes late by design, and now retries
      # itself back after a failure - so a single read right after a swap would fail a release that was
      # about to be fine.
      #
      # IT FAILS THE RUN AND DOES NOT ROLL BACK. A subsystem that is down does not make the new image worse
      # than the old one, and the swap-back would ship the same code; what it needs is to be seen. The
      # failure is what makes it impossible to walk away from a deploy that left a page dead.
      #
      # AN ABSENT BLOCK IS A FAILURE, NOT A PASS. A missing `subsystems` object means the Gateway serving
      # production does not report readiness at all - an image older than this contract, or a wiring
      # regression that dropped the block. Treating that as "nothing to check" would make this step
      # certify precisely the deploys it cannot see into, which is the failure it exists to remove.
      - name: Prove every subsystem came up
        # `always()` IS LOAD-BEARING HERE - WITHOUT IT THIS STEP IS SILENT ON EXACTLY THE DEPLOYS THAT
        # NEED IT.
        #
        # A step whose `if:` does not mention always()/failure() is implicitly ANDed with success(), so a
        # bare condition here means "...and every earlier step passed". The step above measures the
        # outage and FAILS the run when it exceeds the budget. So the first time this check mattered -
        # run 33666956643, the deploy of the incident fix itself - the outage step failed at 36.4s and
        # this step was SKIPPED. A troubled deploy is the one where "did the pages actually come up?" is
        # worth asking, and it was the one case that could not ask it.
        #
        # That is a check whose pass condition was an absence: nothing failed here, because nothing ran
        # here, and the run's own summary showed no subsystem complaint. The step exists because a green
        # signal over a dead page cost four and a half hours on 2 September 2026; shipping it in a form
        # that goes quiet whenever anything else is wrong would have reproduced that fault inside its own
        # fix.
        #
        # The rest of the guard is unchanged and is a real exclusion, not a convenience: readiness_outcome
        # is 'healthy' only when a swap actually put the new image into production. A refused deploy
        # (wrong ref, failed checks) leaves the OLD image serving and must not be held to this contract.
        if: always() && needs.deploy.outputs.readiness_outcome == 'healthy'
        run: |
          deadline=$(( $(date +%s) + 180 ))
          last=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            body=$(curl -s -m 10 "${GATEWAY_URL}/healthz" 2>/dev/null || echo '')
            # Every subsystem value, one per line, as "name=state". Empty when the block is absent.
            last=$(printf '%s' "$body" | jq -r '.subsystems // {} | to_entries[] | "\(.key)=\(.value)"' 2>/dev/null || echo '')
            down=$(printf '%s\n' "$last" | grep -v '=available$' | grep -v '^$' || true)
            if [ -n "$last" ] && [ -z "$down" ]; then
              echo "Every subsystem reports available:"
              printf '%s\n' "$last" | sed 's/^/  /'
              exit 0
            fi
            if [ -z "$last" ]; then
              echo "production /healthz carries no subsystems block yet (waiting)"
            else
              echo "subsystem(s) not available yet: $(printf '%s' "$down" | tr '\n' ' ')"
            fi
            sleep 5
          done

          echo ""
          if [ -z "$last" ]; then
            echo "ERROR: production /healthz reports NO subsystem readiness at all after 180s."
            echo "       Either the image serving production predates this contract, or the wiring that"
            echo "       builds the block was dropped. This step cannot certify a deploy it cannot see"
            echo "       into, so it fails rather than passing on an absence."
          else
            echo "ERROR: production is serving, but a subsystem behind the pages never came up:"
            printf '%s\n' "$last" | sed 's/^/  /'
            echo ""
            echo "       The Gateway is healthy and its pages are NOT. This is the 2 September 2026 shape:"
            echo "       a green deploy over a dead page. Read the Gateway log for the named reason (it is"
            echo "       not on /healthz on purpose - the reason names the database host and that endpoint"
            echo "       is public), and check the authenticated feed for the page in question."
            echo ""
            echo "       A statistics store that could not be reached now retries itself, so re-check"
            echo "       before doing anything: it may have come back on its own since this ran."
          fi
          exit 1

      # Does this deploy carry a schema change to the LIVE Supabase Postgres? Diff the Postgres migration set
      # (the one Database.Migrate() applies on hosted) between the outgoing live commit and the shipped one.
      # "unknown" (never a guess) when the outgoing commit is not readable - the image predated the .commit
      # field, or the commit is not in this shallow clone.
      - name: Detect migration delta
        id: migration
        if: always()
        run: |
          OUT="${{ needs.deploy.outputs.outgoing_commit }}"
          if [ -z "$OUT" ]; then
            echo "migration=unknown" >> "$GITHUB_OUTPUT"
            echo "Outgoing commit unknown - cannot diff migrations."
            exit 0
          fi
          git fetch --depth=200 origin >/dev/null 2>&1 || true
          if git cat-file -e "${OUT}^{commit}" 2>/dev/null; then
            n=$(git diff --name-only "$OUT" HEAD -- 'src/CcDirector.Gateway.Migrations.Postgres/Migrations/' | grep -c . || true)
            if [ "${n:-0}" -gt 0 ]; then
              echo "migration=yes" >> "$GITHUB_OUTPUT"
              echo "Migration delta: $n changed Postgres migration file(s) between $OUT and HEAD."
            else
              echo "migration=no" >> "$GITHUB_OUTPUT"
              echo "No Postgres migration change between $OUT and HEAD (code-only deploy)."
            fi
          else
            echo "migration=unknown" >> "$GITHUB_OUTPUT"
            echo "Outgoing commit $OUT not present in this clone - cannot diff migrations."
          fi

      # Auto-emit the per-deploy metrics so tracking is automatic, not a hand-measured after-the-fact note.
      # Runs even on a failed readiness check so a bad deploy is recorded too. Writes a ledger-ready markdown
      # row to the job summary AND a machine-readable deploy-metrics.json artifact. It does NOT push to the
      # ledger in the PRIVATE devthrottle_internal repo: that would need a stored cross-repo token, and this
      # workflow is deliberately secretless (OIDC only). Paste the row from the summary, or wire a scoped PAT
      # later if fully-hands-off ledger commits are wanted.
      - name: Emit deploy metrics
        id: metrics
        if: always()
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          TARGET="${{ needs.deploy.outputs.short }}"
          FULL=$(git rev-parse HEAD)
          # The readiness step reports only that the swap put the new commit into production. It is set
          # BEFORE the settle step, the staging cleanup and the ten-minute watch, so on its own it calls a
          # run "healthy" that later failed its outage budget or left staging running - a false green in
          # the deploy ledger, which is the one record we go back and read. Fold in the deploy job's real
          # result and the watch step's real result. (Pre-existing on main; the split is what finally makes
          # `needs.deploy.result` available to say it.)
          OUTCOME="${{ needs.deploy.outputs.readiness_outcome }}"; OUTCOME="${OUTCOME:-failed}"
          DEPLOY_RESULT="${{ needs.deploy.result }}"
          OUTAGE_RESULT="${{ steps.outage.outcome }}"
          SUPERSEDED="${{ steps.outage.outputs.superseded }}"

          # Every way this run can be less than healthy gets its own word. "skipped" matters as much as
          # "failure": if the checkout, the artifact download, the Azure login or the poller start fails,
          # the watch never runs, and a record that still said "healthy" would be claiming a ten-minute
          # observation that never happened.
          if [ "$OUTCOME" = "healthy" ]; then
            if [ "$DEPLOY_RESULT" != "success" ]; then
              OUTCOME="swapped-then-failed"
            elif [ "$OUTAGE_RESULT" = "failure" ]; then
              OUTCOME="swapped-then-unavailable"
            elif [ "$OUTAGE_RESULT" != "success" ]; then
              OUTCOME="swapped-then-unmeasured"
            elif [ "$SUPERSEDED" = "yes" ]; then
              OUTCOME="superseded"
            elif [ "$SUPERSEDED" = "unknown" ]; then
              OUTCOME="healthy-but-unverified"
            fi
          fi

          # Named for what was observed, not for the cause we assume. Empty means the watch never ran, which
          # is "not measured" - never "no".
          case "$SUPERSEDED" in
            yes)     ROLLBACK="superseded-during-watch" ;;
            no)      ROLLBACK="no" ;;
            *)       ROLLBACK="not-measured" ;;
          esac
          BUILD_S="${{ needs.deploy.outputs.build_seconds }}"; BUILD_S="${BUILD_S:-}"
          SWAP_S="${{ needs.deploy.outputs.swap_outage_seconds }}"
          OUTAGE_S="${{ steps.outage.outputs.true_outage_seconds }}"
          TOTAL_S="${{ steps.outage.outputs.total_unavailable_seconds }}"
          STATE_LEFT="${{ steps.outage.outputs.site_state_left_running }}"; STATE_LEFT="${STATE_LEFT:-not-measured}"
          TTH_S="${{ needs.deploy.outputs.time_to_healthy_seconds }}"
          MIG="${{ steps.migration.outputs.migration }}"; MIG="${MIG:-unknown}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          cat > deploy-metrics.json <<JSON
          {
            "timestamp_utc": "$NOW",
            "commit_short": "$TARGET",
            "commit_full": "$FULL",
            "outgoing_commit": "${{ needs.deploy.outputs.outgoing_commit }}",
            "run_id": "${{ github.run_id }}",
            "run_url": "$RUN_URL",
            "outcome": "$OUTCOME",
            "build_seconds": "${BUILD_S}",
            "external_outage_seconds": "${OUTAGE_S}",
            "swap_window_gap_seconds": "${SWAP_S}",
            "total_unavailable_seconds": "${TOTAL_S}",
            "site_state_left_running": "${STATE_LEFT}",
            "time_to_healthy_seconds": "${TTH_S}",
            "migration": "$MIG",
            "deploy_job_result": "${DEPLOY_RESULT}",
            "serving_commit_at_end": "${{ steps.outage.outputs.serving_commit_at_end }}",
            "rollback": "$ROLLBACK"
          }
          JSON

          {
            echo "## Hosted Gateway deploy metrics"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| time (UTC) | $NOW |"
            echo "| commit | \`$TARGET\` |"
            echo "| outcome | $OUTCOME |"
            echo "| build | ${BUILD_S:-?}s |"
            echo "| external outage (longest, watched 10 min past the swap) | ${OUTAGE_S:-not measured}s |"
            echo "| total unavailable | ${TOTAL_S:-not measured}s |"
            echo "| gap across the swap itself | ${SWAP_S:-?}s |"
            echo "| site left Running | ${STATE_LEFT} |"
            echo "| time-to-healthy | ${TTH_S:-?}s |"
            echo "| migration | $MIG |"
            echo "| serving commit at end of watch | ${{ steps.outage.outputs.serving_commit_at_end }} |"
            echo "| rollback | $ROLLBACK |"
            echo "| run | $RUN_URL |"
            echo ""
            echo "Ledger-ready row (paste into deploy-ledger.md):"
            echo ""
            echo "\`\`\`"
            echo "$NOW | \`$TARGET\` | ${{ github.run_id }} | build ${BUILD_S:-?}s | migration $MIG | external outage ${OUTAGE_S:-not measured}s (longest, 10 min watch) | time-to-healthy ${TTH_S:-?}s | $OUTCOME"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deploy metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-metrics
          path: deploy-metrics.json
          if-no-files-found: warn
