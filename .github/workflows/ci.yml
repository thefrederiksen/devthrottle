name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A pull request keeps ONE run per branch and supersedes the older one. A push to main gets a group
# of its OWN, one per commit, so it never shares a queue with any other commit.
#
# Why the asymmetry, because getting it the other way round is the expensive mistake. On a pull request
# the head commit is the only one anyone acts on, so an older run for a commit that has already been
# pushed past is spending a runner on an answer nobody will read - cancelling it is right. On a push to
# main, EVERY commit must keep its own verification: a green that belongs to a specific commit is the
# whole point of having continuous integration rather than a memory of a run.
#
# The pull-request half was added after a draft pull request queued six simultaneous runs on one branch,
# none of which superseded any other, so the answer everybody was waiting for kept being pushed further
# out by the very commits that were waiting on it. When a resource serialises, parallelism converts into
# latency rather than throughput, and the cost lands on whoever is waiting rather than on whoever is
# holding.
#
# THE PER-COMMIT GROUP ON MAIN IS THE SECOND HALF, AND IT IS NOT THE SAME KNOB. Turning cancellation off
# for main was believed to be enough, and it is not: cancel-in-progress protects only the run that is
# already EXECUTING, while a concurrency group holds at most ONE run in the pending slot. A third push
# arriving discards whichever run was waiting there. On 3 August, main took 24 runs and 16 of them ended
# cancelled having never started a single job - each one killed to the second by the arrival of the next
# merge, because the .NET job takes about fifty minutes and merges land every two to five. Those runs
# were not superseded mid-flight; they were evicted from the queue before they ever ran.
#
# That was not a cosmetic loss. Two architecture guards were red on main that morning, and the commit
# that fixed them (#2424) had its own run evicted, so nothing on GitHub ever reported either the break
# or the repair. Continuous integration is also the backstop for the three suites parked out of the local
# gate, and a backstop that is evicted before it starts is not a backstop.
#
# Keying the group on the commit removes main from the shared queue entirely: every merge gets a run
# that no later merge can take the slot from. The cost is real and was accepted deliberately - one full
# run per merge instead of one per burst. Runs may still WAIT on the account-wide runner limit, but
# waiting yields a verdict late whereas eviction yields none at all.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test (.NET)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore cc-director.sln

      - name: Build solution
        run: dotnet build cc-director.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test cc-director.sln -c Release --no-build --verbosity normal

      # The installer's own tests. They are NOT in cc-director.sln, so the step above
      # never touched them: roughly 415 tests - the gateway-surface guard, the wizard step flow,
      # the uninstaller tests, the completion classification - ran only when someone happened to
      # invoke them by hand. So a change could have re-broken the first thing a new user ever sees
      # and CI would have stayed green. Found while adding the Git prerequisite row (#2242), by
      # running them manually rather than trusting the green tick. Same shape as the JavaScript
      # gap below.
      #
      # The prerequisite and capability-notice tests this comment used to name are gone with the
      # Prerequisites step itself: the Windows executables carry their own .NET runtime now, so the
      # installer needs nothing already on the machine and has nothing to check.
      #
      # Built here rather than in the solution build: these are net10.0-windows projects
      # outside the solution, so they restore and build themselves.
      - name: Run installer tests
        run: |
          dotnet test tools/cc-director-setup.Tests/ -c Release --verbosity normal
          dotnet test tools/cc-director-setup-engine.Tests/ -c Release --verbosity normal

  # The browser shells (the mobile PWA and the React Cockpit) and the client-core library they share.
  #
  # This job exists because CI ran NO JavaScript tests at all: 583 vitest tests across client-core and
  # the Cockpit were green only when someone happened to run them by hand, so nothing stopped a pull
  # request from landing a broken shell. The mobile voice-mode fix in #1631 is guarded by tests in
  # client-core that CI would not have run - which is what prompted this.
  #
  # Ubuntu on purpose: the .NET job needs Windows because the product is a Windows app, but these are
  # platform-independent unit tests and a Vite build, and Ubuntu runners are quicker and cheaper.
  web:
    name: Build & Test (web)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc --noEmit across every workspace. The shells are typechecked on every build locally
      # (#1578/#1579); this is the same gate, enforced on the pull request.
      - name: Typecheck the workspaces
        run: npm run typecheck

      # Named one workspace per line, deliberately NOT `npm test --workspaces --if-present`: that form
      # passes silently for a workspace with no test script, so a suite that lost its script - or a
      # workspace renamed out from under it - would report green while testing nothing. A dead test
      # looks exactly like coverage. If a new workspace gains tests, add a line here and this stays
      # honest about what it actually ran.
      - name: Run client-core tests
        run: npm test --workspace @devthrottle/client-core

      - name: Run Cockpit tests
        run: npm test --workspace @devthrottle/cockpit

      - name: Run mobile tests
        run: npm test --workspace @devthrottle/mobile

      # The shells must still BUILD, not just typecheck: the production build runs the real Vite
      # pipeline (bundling, the PWA service worker) and fails on things tsc never sees.
      - name: Build the mobile PWA
        run: npm run build --workspace @devthrottle/mobile

      - name: Build the Cockpit
        run: npm run build --workspace @devthrottle/cockpit

  # The Python guards over the shipped cc-* toolbelt.
  #
  # This job exists for the same reason the two above it do: nothing ran these. CI ran the .NET
  # solution, the installer projects and the JavaScript workspaces, and NO Python at all - so
  # tools/test_shipped_tools_contract.py, which was written specifically to catch the things that
  # have silently broken a clean install before (a pyproject name that no longer matches the
  # registry, a missing console-script entry point, non-ASCII in shipped source), had been FAILING
  # on main with nobody to see it. A guard nobody runs cannot fail, and a red nobody sees is
  # indistinguishable from green. Found while cutting cc-playwright from the toolbelt (#1002).
  #
  # All three operating systems on purpose. This job used to run on Windows alone, because that is
  # where the tools are installed and where the suite was first verified - and a suite that only
  # ever runs on one operating system proves the tool works on one operating system. The AXI work
  # (#2922) requires cc-devthrottle to be proven on Windows, macOS and Linux, so the matrix came
  # first and the output changes came after. It found a real Windows-shaped assumption on the first
  # run: the setup doctor test put only the install bin directory on PATH, which is where the shim
  # lives on Windows, while on macOS and Linux the shim is a link in the user's own ~/.local/bin -
  # so the doctor correctly reported the tool as unresolvable and the test called that a failure.
  #
  # The dependencies are named explicitly rather than installed from cc-devthrottle's pyproject,
  # because that package depends on the local cc-shared distribution which is not on PyPI. If a
  # dependency is added this job fails loudly with a ModuleNotFoundError rather than quietly
  # skipping anything.
  #
  # cc-devthrottle's own tests run here too. Adding them was the first thing this job did, and it
  # immediately found why they had never survived an unattended run: five asserted plain substrings
  # against Rich-STYLED output, so they passed on a plain console and failed wherever colour is on -
  # which is what a runner is. Those assertions now compare TEXT rather than rendering (#1082), and
  # the suite is required to be green both with colour and without.
  tool-contracts:
    name: Tool contracts (Python)
    runs-on: ${{ matrix.os }}
    strategy:
      # Never stop the other operating systems when one fails. A failure on one of them is exactly
      # the information this matrix exists to produce, and cancelling the rest hides whether the
      # fault is platform-specific or everywhere.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest typer rich requests

      # The shipped-tool contract: registry/pyproject name agreement, console-script entry points,
      # ASCII-only shipped source, and the Rich ASCII patches.
      - name: Run the shipped-tool contract guard
        run: python -m pytest tools/test_shipped_tools_contract.py -q

      # cc-devthrottle is itself a shipped tool and the fleet's command surface; its own tests were
      # equally unrun. Executed from the tool's directory because its tests import `src` directly.
      # FORCE_COLOR is set deliberately: the defect these tests carried only appears when Rich
      # styles its output, so running them the safe way would re-hide exactly what this job caught.
      - name: Run the cc-devthrottle tests
        working-directory: tools/cc-devthrottle
        env:
          FORCE_COLOR: "1"
        run: python -m pytest tests/ -q

      # cc-secrets holds the owner's passwords, so its leak test and its permission checks run on every
      # change. websockets is its one dependency beyond the ones installed above.
      - name: Run the cc-secrets tests
        working-directory: tools/cc-secrets
        env:
          FORCE_COLOR: "1"
        run: |
          python -m pip install websockets
          python -m pytest tests/ -q
