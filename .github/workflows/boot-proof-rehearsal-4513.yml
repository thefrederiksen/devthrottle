# THROWAWAY (issue #4513). Rehearses scripts/prove-image-boots.sh on a real GitHub-hosted runner against a
# good image and a deliberately broken one, without touching Azure or production. Runs only on pushes to
# the #4513 branch. Deleted before merge and disabled with `gh workflow disable`.
name: Boot proof rehearsal (4513, throwaway)

on:
  push:
    branches: [safe-deploys/4513-boot-gate]

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Short commit
        id: short
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build the hosted Gateway image from this checkout
        run: docker build -q --build-arg COCKPIT_COMMIT=${{ steps.short.outputs.short }} -t rehearsal/gateway:good .

      - name: A good image passes the boot proof
        run: bash scripts/prove-image-boots.sh rehearsal/gateway:good "${{ steps.short.outputs.short }}"

      - name: A deliberately broken image fails the boot proof and prints its output
        run: |
          printf 'FROM rehearsal/gateway:good\nUSER root\nRUN rm /app/CcDirector.Gateway.dll\nUSER gateway\n' | docker build -q -t rehearsal/gateway:broken -
          set +e
          bash scripts/prove-image-boots.sh rehearsal/gateway:broken "${{ steps.short.outputs.short }}"
          CODE=$?
          set -e
          if [ "$CODE" -ne 1 ]; then
            echo "REHEARSAL FAILED: the broken image exited the boot proof with $CODE, expected 1."
            exit 1
          fi
          echo "REHEARSAL: the broken image failed the boot proof (exit 1), as it must."
