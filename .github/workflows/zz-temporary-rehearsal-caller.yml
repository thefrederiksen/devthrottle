name: Temporary rehearsal caller

# TEMPORARY. Deleted before this branch is merged, and it exists for one run.
#
# The hosted deploy calls the hosted image contract as a job, by relative path, passing
# require_main: true. That wiring - the call, the input, and the refusal it produces off main - cannot
# be seen by running the contract workflow on its own, and the only other way to see it is to start a
# real deploy, which is not something to do for a rehearsal. So this calls it exactly as the deploy
# does, on a branch, where require_main: true must REFUSE.
#
# Expected result: the called job FAILS, at its first step, saying the ref is not main. A green run
# here would mean the input is not wired up.

on:
  push:
    branches: [ci/package-1-hosted-image-test-to-deploy]

jobs:
  hosted-image-contract:
    name: Hosted image contract
    uses: ./.github/workflows/hosted-image-contract.yml
    with:
      require_main: true
