name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------
  # Job 1: Build the main CC Director Avalonia app (Windows)
  # ---------------------------------------------------------------
  # CcDirector.Wpf was archived in commit c557e58c -- the Avalonia app
  # is now the canonical main app for both Windows and macOS.
  build-director-win:
    name: Build CC Director (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish for Windows x64
        # Self-contained: the .NET runtime ships INSIDE the executable, so no machine has to install
        # one. macOS has always published this way; Windows did not, which made the runtime the single
        # thing that could stop a fresh install dead - and the whole reason the wizard had a
        # Prerequisites screen with a gate on it. The exe grows from about 37 MB to about 118 MB, and
        # that cost lands on every automatic update, not only the first install. It buys an installer
        # that cannot dead-end on a clean machine.
        run: >
          dotnet publish src/CcDirector.Avalonia/CcDirector.Avalonia.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:UpdaterEnabled=true

      # Sign the exe as Center Consulting Inc. before it becomes the release asset.
      # No-op until the repo has SIGNING_CERT_PROFILE + the AZURE_* secrets set.
      - name: Sign cc-director.exe
        if: ${{ vars.SIGNING_CERT_PROFILE != '' }}
        uses: ./.github/actions/sign-windows
        with:
          folder: src/CcDirector.Avalonia/bin/Release/net10.0/win-x64/publish
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          certificate-profile-name: ${{ vars.SIGNING_CERT_PROFILE }}

      - name: Upload cc-director artifact
        uses: actions/upload-artifact@v6
        with:
          name: cc-director-win
          path: src/CcDirector.Avalonia/bin/Release/net10.0/win-x64/publish/cc-director.exe
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Job 1b: Build the main CC Director Avalonia app (macOS arm64)
  # ---------------------------------------------------------------
  # Runs on the Apple-Silicon runner (macos-14) for a native osx-arm64 build --
  # no cross-compile. Produces a self-contained, ad-hoc-signed .app bundle zipped
  # for distribution. Unsigned/non-notarized by design (no Apple Developer
  # account): the auto-updater strips the Gatekeeper quarantine flag on install.
  build-director-mac:
    name: Build CC Director (macOS arm64)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish for macOS arm64
        # Do NOT add EnableCompressionInSingleFile here: on macOS arm64 under .NET 10 the
        # compressed bundle corrupts memory in the HTTP stack (AccessViolationException,
        # crash on the first outbound request). Proven on hardware in issue #1442.
        run: >
          dotnet publish src/CcDirector.Avalonia/CcDirector.Avalonia.csproj
          -c Release -r osx-arm64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:UpdaterEnabled=true

      - name: Package distributable .app bundle (zip + drag-to-Applications DMG)
        run: >
          scripts/package-mac-app.sh
          --binary src/CcDirector.Avalonia/bin/Release/net10.0/osx-arm64/publish/cc-director
          --out artifacts-mac
          --dmg-name devthrottle-mac-arm64.dmg

      - name: Upload cc-director mac artifact
        uses: actions/upload-artifact@v6
        with:
          name: cc-director-mac
          path: |
            artifacts-mac/cc-director-mac-arm64.zip
            artifacts-mac/devthrottle-mac-arm64.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Job 1c: Build the macOS Python tools bundle (arm64)
  # ---------------------------------------------------------------
  # The mac analog of build-python-bundle-win: scripts/build-python-bundle.sh builds the
  # shared-venv payload (cc-python-macos-arm64.tar.gz + cc-tools-pyenv-macos-arm64.tar.gz),
  # core tools only - a tool ships when it has "ship": true in tools/registry.json.
  build-python-bundle-mac:
    name: Build Python Tools Bundle (macOS arm64)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Build the macOS Python tools bundle
        run: bash scripts/build-python-bundle.sh dist/python-bundle

      - name: Upload macOS Python bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: python-bundle-mac
          path: dist/python-bundle/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Job 1d: Build the macOS setup wizard (.app)
  # ---------------------------------------------------------------
  # The cross-platform Avalonia wizard, published self-contained for osx-arm64 and packaged
  # as an ad-hoc-signed "DevThrottle Setup.app" (same model as the Director app).
  build-setup-mac:
    name: Build Setup Wizard (macOS arm64)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish setup wizard for macOS arm64
        # No EnableCompressionInSingleFile on macOS - memory corruption, issue #1442.
        run: >
          dotnet publish tools/cc-director-setup-avalonia/CcDirectorSetup.csproj
          -c Release -r osx-arm64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Package distributable Setup .app bundle (zip)
        run: >
          scripts/package-mac-app.sh
          --binary tools/cc-director-setup-avalonia/bin/Release/net10.0/osx-arm64/publish/cc-director-setup
          --out artifacts-mac
          --app-name "DevThrottle Setup"
          --bin-name cc-director-setup
          --zip-name cc-director-setup-mac-arm64.zip
          --bid com.devthrottle.ccdirectorsetup

      - name: Upload macOS setup wizard artifact
        uses: actions/upload-artifact@v6
        with:
          name: setup-mac
          path: artifacts-mac/cc-director-setup-mac-arm64.zip
          if-no-files-found: error

      # The headless CLI ships for macOS too, so an agent (or a user over ssh) can install and
      # update every component from the command line without the graphical wizard (issue #1445).
      # No EnableCompressionInSingleFile on macOS - memory corruption, issue #1442.
      - name: Publish self-contained setup CLI for macOS arm64
        run: >
          dotnet publish tools/cc-director-setup-cli/CcDirector.Setup.Cli.csproj
          -c Release -r osx-arm64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --nologo

      - name: Upload macOS setup CLI artifact
        uses: actions/upload-artifact@v6
        with:
          name: setup-cli-mac
          path: tools/cc-director-setup-cli/bin/Release/net10.0/osx-arm64/publish/cc-director-setup-cli
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Job 1c: Build the CC Gateway tray app (Windows)
  # ---------------------------------------------------------------
  # THE Gateway: an Avalonia tray app that hosts the gateway in-process, supervises
  # the Cockpit, and self-updates - per-user, started at logon, no Windows service
  # (docs/plans/gateway-tray-app.md). AssemblyName is "devthrottle-gateway", so the
  # published single file is devthrottle-gateway.exe; the create-release job renames
  # it to the asset name the setup engine expects
  # (ComponentRegistry.Gateway.WindowsAsset = devthrottle-gateway-win-x64.exe).
  # The old headless console host (CcDirector.Gateway) is the dev loop only.
  build-gateway-win:
    name: Build CC Gateway (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish Gateway tray app for Windows x64
        # Self-contained, like the Director and the launcher. This wizard does not install the
        # gateway - that is a separate do-it-yourself install from the repository - but it DOES
        # refresh an existing gateway host on update, and the .NET prerequisite gate that used to
        # protect that path is gone. Framework-dependent here meant setup could replace the gateway,
        # stop the old process, and then fail to start the new one on a machine without .NET,
        # leaving the gateway down. About 64 MB becomes about 144 MB on an asset the installer never
        # downloads, so it costs nothing at install time.
        run: >
          dotnet publish src/CcDirector.GatewayApp/CcDirector.GatewayApp.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      # filter: exe -> signs only devthrottle-gateway.exe, not the wwwroot/mobile web assets.
      - name: Sign devthrottle-gateway.exe
        if: ${{ vars.SIGNING_CERT_PROFILE != '' }}
        uses: ./.github/actions/sign-windows
        with:
          folder: src/CcDirector.GatewayApp/bin/Release/net10.0-windows/win-x64/publish
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          certificate-profile-name: ${{ vars.SIGNING_CERT_PROFILE }}

      - name: Upload gateway artifact
        uses: actions/upload-artifact@v6
        with:
          name: gateway-win
          path: src/CcDirector.GatewayApp/bin/Release/net10.0-windows/win-x64/publish/devthrottle-gateway.exe
          if-no-files-found: error

      # Issue #809: the single-file Gateway exe carries NO loose content, so the built mobile app
      # (issue #806, staged into wwwroot/mobile by the release-gated MSBuild target during the Release
      # publish above) must ship as its OWN asset - the setup engine unpacks it beside the exe on
      # install + self-update. The zip's root is the CONTENTS of wwwroot/mobile (index.html + hashed
      # assets/), matching MobilePackage's extract-into-wwwroot/mobile contract.
      - name: Package mobile app (wwwroot/mobile) as zip
        shell: pwsh
        run: |
          $pub = "src/CcDirector.GatewayApp/bin/Release/net10.0-windows/win-x64/publish"
          $m = Join-Path $pub "wwwroot/mobile"
          if (-not (Test-Path (Join-Path $m "index.html"))) {
            Write-Error "Mobile app build missing: $m/index.html not found in the Gateway publish output. The release-gated mobile build (CcDirector.Gateway.csproj BuildMobileApp target) did not run."
            exit 1
          }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path (Join-Path $m '*') -DestinationPath "artifacts/devthrottle-gateway-mobile-win-x64.zip" -Force
          Write-Host "Packaged mobile app files:"
          Get-ChildItem -Recurse -File $m | ForEach-Object { $_.FullName.Substring($m.Length).TrimStart('\','/') }

      - name: Upload gateway mobile artifact
        uses: actions/upload-artifact@v6
        with:
          name: gateway-mobile-win
          path: artifacts/devthrottle-gateway-mobile-win-x64.zip
          if-no-files-found: error

      # Issue #979 (epic #967 cutover): the single-file Gateway exe carries NO loose content, so the
      # built React Cockpit (staged into wwwroot/c by the release-gated BuildCockpitApp MSBuild target
      # during the Release publish above) must ship as its OWN asset - the setup engine unpacks it
      # beside the exe on install + self-update. The zip's root is the CONTENTS of wwwroot/c
      # (index.html + hashed assets/), matching CockpitAssetPackage's extract-into-wwwroot/c contract.
      - name: Package Cockpit (wwwroot/c) as zip
        shell: pwsh
        run: |
          $pub = "src/CcDirector.GatewayApp/bin/Release/net10.0-windows/win-x64/publish"
          $c = Join-Path $pub "wwwroot/c"
          if (-not (Test-Path (Join-Path $c "index.html"))) {
            Write-Error "Cockpit build missing: $c/index.html not found in the Gateway publish output. The release-gated Cockpit build (CcDirector.Gateway.csproj BuildCockpitApp target) did not run."
            exit 1
          }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path (Join-Path $c '*') -DestinationPath "artifacts/devthrottle-gateway-cockpit-win-x64.zip" -Force
          Write-Host "Packaged Cockpit files:"
          Get-ChildItem -Recurse -File $c | ForEach-Object { $_.FullName.Substring($c.Length).TrimStart('\','/') }

      - name: Upload gateway cockpit artifact
        uses: actions/upload-artifact@v6
        with:
          name: gateway-cockpit-win
          path: artifacts/devthrottle-gateway-cockpit-win-x64.zip
          if-no-files-found: error

      # Issue #1186: the single-file Gateway exe carries NO loose content, so the ffmpeg the Gateway
      # shells out to for the long-clip WebM/Opus -> PCM WAV transcode (issue #1139) must ship as its OWN
      # side-car asset the setup engine unpacks BESIDE the exe on install + self-update (FfmpegPackage,
      # same delivery as the mobile app / Cockpit). We download a PINNED, reputable static Windows ffmpeg
      # (scripts/ffmpeg-pin.json - the single source of truth for the version), SHA-256 verify it (fail
      # loud on mismatch - never ship an unverified binary), and repack ffmpeg.exe + its GPL license +
      # a source-offer note as ffmpeg-win-x64.zip (zip root = ffmpeg.exe, matching FfmpegPackage's
      # extract-into-GatewayDir contract).
      - name: Package pinned ffmpeg (ffmpeg-win-x64.zip)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content scripts/ffmpeg-pin.json -Raw | ConvertFrom-Json
          Write-Host "[ffmpeg] pin: version=$($pin.version) provider=$($pin.provider)"
          Write-Host "[ffmpeg] url=$($pin.archiveUrl)"

          $work = Join-Path $env:RUNNER_TEMP ("ffmpeg-" + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $archive = Join-Path $work "ffmpeg-archive.zip"

          Write-Host "[ffmpeg] downloading pinned archive..."
          Invoke-WebRequest -Uri $pin.archiveUrl -OutFile $archive -UseBasicParsing

          # Verify SHA-256 against the pin - a mismatch means a tampered or moved build; fail the release.
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = $pin.archiveSha256.ToLowerInvariant()
          if ($actual -ne $expected) {
            Write-Error "[ffmpeg] SHA-256 mismatch: expected $expected but got $actual. Refusing to ship an unverified ffmpeg."
            exit 1
          }
          Write-Host "[ffmpeg] SHA-256 verified: $actual"

          $extract = Join-Path $work "extract"
          Expand-Archive -Path $archive -DestinationPath $extract -Force

          # Locate ffmpeg.exe (the pin records the expected path, but recurse so a provider layout tweak
          # doesn't silently drop it - a missing exe fails loud below).
          $exe = Get-ChildItem -Path $extract -Recurse -Filter $pin.exeNameInArchive | Select-Object -First 1
          if (-not $exe) {
            Write-Error "[ffmpeg] $($pin.exeNameInArchive) not found inside the pinned archive."
            exit 1
          }
          Write-Host "[ffmpeg] found $($exe.FullName) ($([math]::Round($exe.Length/1MB,1)) MB)"

          $license = Get-ChildItem -Path $extract -Recurse -Filter "LICENSE" | Select-Object -First 1

          # Stage the side-car payload: ffmpeg.exe at the zip root (beside where the Gateway exe installs)
          # plus GPL attribution + a written source offer (our app is MIT; ffmpeg essentials is GPL, and we
          # invoke it as a separate process - standard mere-aggregation, but we still ship the license text
          # and a source pointer for compliance).
          $stage = Join-Path $work "stage"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item $exe.FullName (Join-Path $stage $pin.exeNameInArchive) -Force
          if ($license) { Copy-Item $license.FullName (Join-Path $stage "LICENSE-ffmpeg.txt") -Force }

          # Build the attribution note line-by-line (a PowerShell here-string's column-0 terminator would
          # break the surrounding YAML block scalar).
          $readme = @(
            "This directory ships ffmpeg.exe, a pinned static build of FFmpeg, used by the DevThrottle",
            "Gateway to transcode long audio recordings (WebM/Opus, MP4/AAC, MP3, ...) to PCM WAV for",
            "transcription (issue #1139).",
            "",
            "FFmpeg version : $($pin.version)",
            "Build provider : $($pin.provider)",
            "Source archive : $($pin.archiveUrl)",
            "SHA-256        : $($pin.archiveSha256)",
            "License        : GPL - see LICENSE-ffmpeg.txt in this directory.",
            "",
            "DevThrottle itself is MIT-licensed and invokes ffmpeg.exe only as a separate process (mere",
            "aggregation). FFmpeg source code and the corresponding build scripts are available from the",
            "build provider above and from the upstream project at https://ffmpeg.org/download.html and",
            "https://git.ffmpeg.org/ffmpeg.git . The version tag above identifies the source revision."
          )
          Set-Content -Path (Join-Path $stage "ffmpeg-README-license.txt") -Value $readme -Encoding utf8

          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $out = "artifacts/ffmpeg-win-x64.zip"
          if (Test-Path $out) { Remove-Item $out -Force }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $out -Force
          Write-Host "[ffmpeg] packaged $out with:"
          Get-ChildItem $stage | ForEach-Object { Write-Host "  - $($_.Name)" }

      - name: Upload gateway ffmpeg artifact
        uses: actions/upload-artifact@v6
        with:
          name: gateway-ffmpeg-win
          path: artifacts/ffmpeg-win-x64.zip
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Job 1c2: Build the CC Launcher tray app (Windows)
  # ---------------------------------------------------------------
  # The always-on Windows tray launcher (issue #250): clean process parentage + a loopback REST API,
  # supervises the Director, and self-updates in managed mode (docs/plans/cc-launcher.md). Ships to
  # BOTH roles. AssemblyName is "cc-launcher", so the published single file is cc-launcher.exe; the
  # create-release job renames it to the asset name the setup engine expects
  # (ComponentRegistry.Launcher.WindowsAsset = cc-launcher-win-x64.exe).
  build-launcher-win:
    name: Build CC Launcher (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish Launcher tray app for Windows x64
        # Self-contained, for the same reason as the Director: the launcher is placed by the installer
        # on every Windows machine, so it must not need a runtime either. About 29 MB becomes about
        # 110 MB. The Gateway tray app is deliberately NOT bundled - it is not installed by this
        # wizard, it is a do-it-yourself install run from the repository.
        # The explicit framework is required once the launcher project multi-targets for macOS
        # (net10.0-windows;net10.0) and is harmless before that.
        run: >
          dotnet publish src/CcDirector.Launcher/CcDirector.Launcher.csproj
          -c Release -f net10.0-windows -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Sign cc-launcher.exe
        if: ${{ vars.SIGNING_CERT_PROFILE != '' }}
        uses: ./.github/actions/sign-windows
        with:
          folder: src/CcDirector.Launcher/bin/Release/net10.0-windows/win-x64/publish
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          certificate-profile-name: ${{ vars.SIGNING_CERT_PROFILE }}

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v6
        with:
          name: launcher-win
          path: src/CcDirector.Launcher/bin/Release/net10.0-windows/win-x64/publish/cc-launcher.exe
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Job 1c3: Build the CC Launcher (macOS arm64)
  # ---------------------------------------------------------------
  # The CC Launcher mission (2026-07-11): the same launcher, published for Apple-silicon Macs as a
  # self-contained single-file executable. It installs to the per-user launcher directory and runs
  # as a user launch agent (label com.devthrottle.cc-launcher). The project multi-targets
  # net10.0-windows;net10.0, so the plain net10.0 framework must be selected explicitly here.
  # Ad-hoc signed like the other macOS binaries; the installer strips the Gatekeeper quarantine.
  build-launcher-mac:
    name: Build CC Launcher (macOS arm64)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish Launcher for macOS arm64
        # No EnableCompressionInSingleFile on macOS - memory corruption, issue #1442.
        run: >
          dotnet publish src/CcDirector.Launcher/CcDirector.Launcher.csproj
          -c Release -f net10.0 -r osx-arm64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Upload launcher mac artifact
        uses: actions/upload-artifact@v6
        with:
          name: launcher-mac
          path: src/CcDirector.Launcher/bin/Release/net10.0/osx-arm64/publish/cc-launcher
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Job 1e: Build the main CC Director Avalonia app (Linux x64)
  # ---------------------------------------------------------------
  # SELF-CONTAINED, and that is a decision rather than a copy of the Windows job's wording: a
  # clean Ubuntu desktop has no .NET at all, and the Director needs the ASP.NET CORE runtime
  # rather than the base one because ControlApi hosts Kestrel. A framework-dependent download
  # would dead-end on exactly the machine this job exists for. About 107 MB is the price.
  #
  # It ships as a bare executable, like the macOS launcher and setup CLI. Linux has no
  # application bundle, no code signature and no quarantine flag, so there is nothing for a
  # wrapper to carry and no signing step to add.
  #
  # Only linux-x64 is published. linux-arm64 compiles - Phase 0 of the Linux mission produced
  # one - but nobody has ever executed it, so it is deliberately not offered as a download.
  build-director-linux:
    name: Build CC Director (Linux x64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish for Linux x64
        run: >
          dotnet publish src/CcDirector.Avalonia/CcDirector.Avalonia.csproj
          -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:UpdaterEnabled=true

      # actions/upload-artifact does not carry the executable bit, so what comes back down in
      # create-release is a plain file. That is already true of cc-launcher-mac-arm64 and
      # devthrottle-setup-cli-mac-arm64; whatever places the binary chmods it (scripts/install-linux.sh
      # does, and so does the setup engine). Do not read a non-executable release asset as a defect.
      - name: Upload cc-director linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: cc-director-linux
          path: src/CcDirector.Avalonia/bin/Release/net10.0/linux-x64/publish/cc-director
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Job 1f: Build the Linux Python tools bundle (x64)
  # ---------------------------------------------------------------
  # The Linux analog of build-python-bundle-mac, running the SAME script: it switches on
  # uname and emits cc-python-linux-x64.tar.gz + cc-tools-pyenv-linux-x64.tar.gz, core tools
  # only (a tool ships when it has "ship": true in tools/registry.json).
  #
  # actions/setup-python is load-bearing here and not decoration. Step 4 of the script fills the
  # wheelhouse with "python3 -m pip download", and stock Ubuntu ships python3 with no pip module
  # at all - Debian and Ubuntu package it separately. The runner's own python3 would fail the
  # script's up-front pip check; setup-python supplies one that has pip.
  build-python-bundle-linux:
    name: Build Python Tools Bundle (Linux x64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Build the Linux Python tools bundle
        run: bash scripts/build-python-bundle.sh dist/python-bundle

      - name: Upload Linux Python bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: python-bundle-linux
          path: dist/python-bundle/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Job 1g: Build the Linux setup wizard and setup CLI (x64)
  # ---------------------------------------------------------------
  # The counterpart of build-setup-mac, and like it this one job produces both the graphical
  # wizard and the headless CLI. The wizard is the same cross-platform Avalonia project the Mac
  # uses (tools/cc-director-setup-avalonia, AssemblyName cc-director-setup), published
  # self-contained so a machine with no .NET can run it - which is the whole point of the
  # installer. scripts/install-linux.sh downloads exactly this asset and hands over to it.
  build-setup-linux:
    name: Build Setup Wizard (Linux x64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish setup wizard for Linux x64
        run: >
          dotnet publish tools/cc-director-setup-avalonia/CcDirectorSetup.csproj
          -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --nologo

      - name: Upload Linux setup wizard artifact
        uses: actions/upload-artifact@v6
        with:
          name: setup-linux
          path: tools/cc-director-setup-avalonia/bin/Release/net10.0/linux-x64/publish/cc-director-setup
          if-no-files-found: error

      # The headless CLI ships for Linux for the same reason it ships for macOS (issue #1445): an
      # agent, or a person over ssh, can install and update every component from the command line
      # with no graphical session at all.
      - name: Publish self-contained setup CLI for Linux x64
        run: >
          dotnet publish tools/cc-director-setup-cli/CcDirector.Setup.Cli.csproj
          -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --nologo

      - name: Upload Linux setup CLI artifact
        uses: actions/upload-artifact@v6
        with:
          name: setup-cli-linux
          path: tools/cc-director-setup-cli/bin/Release/net10.0/linux-x64/publish/cc-director-setup-cli
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Job 1h: Build the CC Launcher (Linux x64)
  # ---------------------------------------------------------------
  # The counterpart of build-launcher-mac. The project multi-targets net10.0-windows;net10.0, so
  # the plain net10.0 framework must be selected explicitly here exactly as the macOS job does.
  build-launcher-linux:
    name: Build CC Launcher (Linux x64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish Launcher for Linux x64
        run: >
          dotnet publish src/CcDirector.Launcher/CcDirector.Launcher.csproj
          -c Release -f net10.0 -r linux-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Upload launcher linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: launcher-linux
          path: src/CcDirector.Launcher/bin/Release/net10.0/linux-x64/publish/cc-launcher
          if-no-files-found: error

  # The Blazor Server Cockpit had its own build job here; it was retired in the epic #967 cutover
  # (issue #979). The React Cockpit now ships INSIDE the Gateway: the release-gated BuildCockpitApp
  # MSBuild target on CcDirector.Gateway.csproj builds apps/cockpit and stages it into the Gateway's
  # wwwroot/c during the Gateway publish job below. There is no separate Cockpit artifact.

  # ---------------------------------------------------------------
  # Job 2: Build the Python tools bundle (Windows)
  # ---------------------------------------------------------------
  # The core cc-* Python tools ship as ONE shared-venv bundle instead of per-tool
  # PyInstaller exes. This job runs scripts/build-python-bundle.ps1, which builds the
  # shipped tool wheels + a de-duped wheelhouse and bundles a python-build-standalone
  # CPython, emitting two assets:
  #   cc-python-win-x64.zip       (the runtime)
  #   cc-tools-pyenv-win-x64.zip  (wheelhouse + requirements.lock + tools-manifest.json)
  # Core is an explicit allowlist: a tool ships only when it has "ship": true in
  # tools/registry.json. The installer (PythonToolsInstaller) creates a venv from the
  # bundled python and pip-installs the core tools offline from the wheelhouse.
  build-python-bundle-win:
    name: Build Python Tools Bundle (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Build the Python tools bundle
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-python-bundle.ps1 -OutputDir dist/python-bundle

      - name: Upload Python bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: python-bundle-win
          path: dist/python-bundle/*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Job 3: Build Setup Wizard (Windows)
  # ---------------------------------------------------------------
  build-setup-wizard-win:
    name: Build Setup Wizard (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained setup wizard
        run: >
          dotnet publish tools/cc-director-setup/CcDirectorSetup.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --nologo

      # The setup wizard is the FIRST thing new downloaders run, so signing it
      # (killing "Unknown Publisher" on the installer) matters most of all.
      - name: Sign cc-director-setup.exe
        if: ${{ vars.SIGNING_CERT_PROFILE != '' }}
        uses: ./.github/actions/sign-windows
        with:
          folder: tools/cc-director-setup/bin/Release/net10.0-windows/win-x64/publish
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          certificate-profile-name: ${{ vars.SIGNING_CERT_PROFILE }}

      - name: Upload setup wizard artifact
        uses: actions/upload-artifact@v6
        with:
          name: setup-wizard-win
          path: tools/cc-director-setup/bin/Release/net10.0-windows/win-x64/publish/cc-director-setup.exe
          if-no-files-found: error

      # The headless CLI is shipped too: the WPF wizard downloads it to run the elevated, machine-scoped
      # Gateway install (the wizard stays non-elevated; the CLI is the single source of truth, decision D2).
      - name: Publish self-contained setup CLI
        run: >
          dotnet publish tools/cc-director-setup-cli/CcDirector.Setup.Cli.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --nologo

      - name: Sign cc-director-setup-cli.exe
        if: ${{ vars.SIGNING_CERT_PROFILE != '' }}
        uses: ./.github/actions/sign-windows
        with:
          folder: tools/cc-director-setup-cli/bin/Release/net10.0/win-x64/publish
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          certificate-profile-name: ${{ vars.SIGNING_CERT_PROFILE }}

      - name: Upload setup CLI artifact
        uses: actions/upload-artifact@v6
        with:
          name: setup-cli-win
          path: tools/cc-director-setup-cli/bin/Release/net10.0/win-x64/publish/cc-director-setup-cli.exe
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Final Job: Create GitHub Release
  # ---------------------------------------------------------------
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - build-director-win
      - build-director-mac
      - build-gateway-win
      - build-launcher-win
      - build-launcher-mac
      - build-python-bundle-win
      - build-python-bundle-mac
      - build-setup-wizard-win
      - build-setup-mac
      - build-director-linux
      - build-launcher-linux
      - build-python-bundle-linux
      - build-setup-linux

    steps:
      - uses: actions/checkout@v5

      # The tag is the release version; Directory.Build.props is the version
      # stamped into every binary. They MUST agree (see docs/architecture/VERSIONING.md).
      # new-release.ps1 keeps them in sync; this guard catches hand-made tags.
      - name: Verify tag matches Directory.Build.props
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROPS_VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props)
          echo "Tag: $TAG_VERSION | Directory.Build.props: $PROPS_VERSION"
          if [ "$TAG_VERSION" != "$PROPS_VERSION" ]; then
            echo "::error title=Version mismatch::Tag $GITHUB_REF_NAME does not match Directory.Build.props <Version>$PROPS_VERSION</Version>. Use scripts/new-release.ps1 to cut releases."
            exit 1
          fi

      # The release page publishes OUR WRITTEN NOTES and nothing else.
      #
      # This workflow used to switch on the release action's own note GENERATION, which produced a
      # list of internal pull-request titles. Every correct-looking release page up to v1.9.0 was
      # a PERSON pasting docs/public/release-notes/<tag>.md over that list afterwards - so the page
      # has been right by accident, not by design. v1.8.7 is the one that shipped as generated:
      # four pull-request titles and a compare link, published to strangers. The switch is gone and
      # a test in CcDirector.Core.Tests keeps it gone, by name.
      #
      # A missing notes file STOPS the release here. There is deliberately no fallback that
      # generates a competing version nobody wrote: a plausible wrong page is worse than no page,
      # because a page that looks like release notes does not get read.
      - name: Resolve the written release notes
        id: notes
        run: |
          NOTES="docs/public/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error title=Release notes missing::$NOTES does not exist at tag $GITHUB_REF_NAME. Write the notes, commit them, and cut the tag again - this workflow does NOT generate release notes."
            {
              echo "## Release STOPPED: no written release notes"
              echo ""
              echo "Expected \`$NOTES\` at tag \`$GITHUB_REF_NAME\`."
              echo ""
              echo "The workflow publishes the notes we wrote and refuses to invent a substitute."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # A file that exists but says nothing is the same defect wearing a different hat, so the
          # floor is on CONTENT (non-whitespace characters), not on the file existing.
          CHARS=$(tr -d '[:space:]' < "$NOTES" | wc -c)
          if [ "$CHARS" -lt 200 ]; then
            echo "::error title=Release notes empty::$NOTES has only $CHARS non-whitespace characters. That is a placeholder, not release notes."
            exit 1
          fi
          echo "Publishing $NOTES ($CHARS non-whitespace characters)."
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts

      - name: List artifacts
        run: find release-artifacts -type f | head -50

      - name: Collect release files
        run: |
          RELEASE_DIR="$(pwd)/release-files"
          mkdir -p "$RELEASE_DIR"

          # Windows main app
          cp release-artifacts/cc-director-win/cc-director.exe "$RELEASE_DIR/cc-director-win-x64.exe"

          # macOS main app (already a .app zip; keep the name the updater expects)
          cp release-artifacts/cc-director-mac/cc-director-mac-arm64.zip "$RELEASE_DIR/cc-director-mac-arm64.zip"

          # macOS drag-to-Applications DMG (the human download; the zip stays the updater asset)
          cp release-artifacts/cc-director-mac/devthrottle-mac-arm64.dmg "$RELEASE_DIR/devthrottle-mac-arm64.dmg"

          # macOS Python tools bundle (one shared-venv bundle: core tools only) + setup wizard .app
          cp release-artifacts/python-bundle-mac/cc-python-macos-arm64.tar.gz "$RELEASE_DIR/cc-python-macos-arm64.tar.gz"
          cp release-artifacts/python-bundle-mac/cc-tools-pyenv-macos-arm64.tar.gz "$RELEASE_DIR/cc-tools-pyenv-macos-arm64.tar.gz"
          cp release-artifacts/setup-mac/cc-director-setup-mac-arm64.zip "$RELEASE_DIR/devthrottle-setup-mac-arm64.zip"

          # Windows Gateway service (publish emits devthrottle-gateway.exe)
          cp release-artifacts/gateway-win/devthrottle-gateway.exe "$RELEASE_DIR/devthrottle-gateway-win-x64.exe"

          # Windows Gateway mobile app (issue #809): the built React PWA (wwwroot/mobile), unpacked beside
          # the Gateway exe by the setup engine on install + self-update so /mobile serves with no manual copy.
          cp release-artifacts/gateway-mobile-win/devthrottle-gateway-mobile-win-x64.zip "$RELEASE_DIR/devthrottle-gateway-mobile-win-x64.zip"

          # Windows React Cockpit (issue #979): the built wwwroot/c, unpacked beside the Gateway exe by
          # the setup engine on install + self-update so the Cockpit serves at the site root.
          cp release-artifacts/gateway-cockpit-win/devthrottle-gateway-cockpit-win-x64.zip "$RELEASE_DIR/devthrottle-gateway-cockpit-win-x64.zip"

          # Windows bundled ffmpeg (issue #1186): the pinned static ffmpeg.exe (+ GPL license/attribution),
          # unpacked beside the Gateway exe by the setup engine on install + self-update so the long-clip
          # WebM/Opus -> PCM WAV transcode (issue #1139) works with no manual copy.
          cp release-artifacts/gateway-ffmpeg-win/ffmpeg-win-x64.zip "$RELEASE_DIR/ffmpeg-win-x64.zip"

          # Windows Launcher tray app (publish emits cc-launcher.exe)
          cp release-artifacts/launcher-win/cc-launcher.exe "$RELEASE_DIR/cc-launcher-win-x64.exe"

          # macOS Launcher (publish emits cc-launcher; the asset name is what
          # ComponentRegistry.Launcher.MacAsset and the Mac installer expect)
          cp release-artifacts/launcher-mac/cc-launcher "$RELEASE_DIR/cc-launcher-mac-arm64"

          # The Cockpit is served in-process by the Gateway (issue #979): its React bundle is baked into
          # the Gateway exe by the BuildCockpitApp MSBuild target, so there is no separate Cockpit asset.

          # Windows Python tools bundle (one shared-venv bundle: core tools only).
          cp release-artifacts/python-bundle-win/cc-python-win-x64.zip "$RELEASE_DIR/cc-python-win-x64.zip"
          cp release-artifacts/python-bundle-win/cc-tools-pyenv-win-x64.zip "$RELEASE_DIR/cc-tools-pyenv-win-x64.zip"

          # Windows setup wizard
          cp release-artifacts/setup-wizard-win/cc-director-setup.exe "$RELEASE_DIR/devthrottle-setup-win-x64.exe"

          # Windows setup CLI (the wizard downloads this to run the elevated Gateway install)
          cp release-artifacts/setup-cli-win/cc-director-setup-cli.exe "$RELEASE_DIR/devthrottle-setup-cli-win-x64.exe"

          # macOS setup CLI (issue #1445: command line install/update on the Mac)
          cp release-artifacts/setup-cli-mac/cc-director-setup-cli "$RELEASE_DIR/devthrottle-setup-cli-mac-arm64"

          # Linux x64: the Director, the Launcher, the setup wizard, the setup CLI and the Python
          # tools bundle. All bare executables apart from the two tarballs - Linux has no
          # application bundle and no signature, so there is nothing to wrap them in. The
          # executable bit does not survive actions/upload-artifact; whatever places the binary
          # sets it (scripts/install-linux.sh and the setup engine both do).
          cp release-artifacts/cc-director-linux/cc-director "$RELEASE_DIR/cc-director-linux-x64"
          cp release-artifacts/launcher-linux/cc-launcher "$RELEASE_DIR/cc-launcher-linux-x64"
          cp release-artifacts/setup-linux/cc-director-setup "$RELEASE_DIR/devthrottle-setup-linux-x64"
          cp release-artifacts/setup-cli-linux/cc-director-setup-cli "$RELEASE_DIR/devthrottle-setup-cli-linux-x64"
          cp release-artifacts/python-bundle-linux/cc-python-linux-x64.tar.gz "$RELEASE_DIR/cc-python-linux-x64.tar.gz"
          cp release-artifacts/python-bundle-linux/cc-tools-pyenv-linux-x64.tar.gz "$RELEASE_DIR/cc-tools-pyenv-linux-x64.tar.gz"

          echo ""
          echo "Release files:"
          ls -lh "$RELEASE_DIR/"

      # No silent drops: a missing REQUIRED asset fails the release. The Python tools ship as one
      # bundle (cc-python runtime + cc-tools-pyenv core wheelhouse); both are required - a missing
      # asset means no tools at all.
      - name: Verify release completeness
        run: |
          RELEASE_DIR="$(pwd)/release-files"

          required=(
            cc-director-win-x64.exe
            cc-director-mac-arm64.zip
            devthrottle-mac-arm64.dmg
            devthrottle-gateway-win-x64.exe
            devthrottle-gateway-mobile-win-x64.zip
            devthrottle-gateway-cockpit-win-x64.zip
            ffmpeg-win-x64.zip
            cc-launcher-win-x64.exe
            cc-launcher-mac-arm64
            devthrottle-setup-win-x64.exe
            devthrottle-setup-cli-win-x64.exe
            devthrottle-setup-cli-mac-arm64
            cc-python-win-x64.zip
            cc-tools-pyenv-win-x64.zip
            cc-python-macos-arm64.tar.gz
            cc-tools-pyenv-macos-arm64.tar.gz
            devthrottle-setup-mac-arm64.zip
            cc-director-linux-x64
            cc-launcher-linux-x64
            devthrottle-setup-linux-x64
            devthrottle-setup-cli-linux-x64
            cc-python-linux-x64.tar.gz
            cc-tools-pyenv-linux-x64.tar.gz
          )

          missing_required=()
          for a in "${required[@]}"; do
            [ -f "$RELEASE_DIR/$a" ] || missing_required+=("$a")
          done

          {
            echo "## Release completeness"
            echo "Required assets: $(( ${#required[@]} - ${#missing_required[@]} ))/${#required[@]} present"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ${#missing_required[@]} -gt 0 ]; then
            echo "::error title=Required asset missing::${missing_required[*]}"
            echo "- MISSING REQUIRED: ${missing_required[*]}" >> "$GITHUB_STEP_SUMMARY"
            echo "ERROR: required assets missing from the release: ${missing_required[*]}"
            exit 1
          fi
          echo "Completeness check passed: all ${#required[@]} required assets present."

      - name: Generate release manifest
        run: |
          RELEASE_DIR="$(pwd)/release-files"
          VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST="$RELEASE_DIR/release-manifest.json"

          echo "{" > "$MANIFEST"
          echo "  \"version\": \"$VERSION\"," >> "$MANIFEST"
          echo "  \"tag\": \"$GITHUB_REF_NAME\"," >> "$MANIFEST"
          echo "  \"date\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"," >> "$MANIFEST"
          echo "  \"assets\": {" >> "$MANIFEST"

          first=true
          for file in "$RELEASE_DIR"/*; do
            filename=$(basename "$file")
            # Skip the manifest itself
            if [ "$filename" = "release-manifest.json" ]; then
              continue
            fi
            size=$(stat -c%s "$file")
            sha256=$(sha256sum "$file" | cut -d' ' -f1)

            # Determine platform from filename
            if echo "$filename" | grep -q "win-x64"; then
              platform="windows"
            elif echo "$filename" | grep -qE "mac.*arm64"; then
              platform="macos"
            elif echo "$filename" | grep -q "linux-x64"; then
              platform="linux"
            else
              platform="unknown"
            fi

            # Per-asset version enables independent-per-component updates: each
            # component is judged on ITS OWN version. Default to the release
            # version; an optional scripts/release-asset-versions.json (a flat
            # {"asset-filename": "x.y.z"} map) overrides individual assets so a
            # single tool can be bumped without a full release. No map => every
            # asset inherits the release version (identical to prior behavior).
            asset_version="$VERSION"
            if [ -f scripts/release-asset-versions.json ]; then
              if ! command -v jq >/dev/null 2>&1; then
                echo "ERROR: scripts/release-asset-versions.json is present but jq is not available; cannot apply per-asset version overrides." >&2
                exit 1
              fi
              override=$(jq -r --arg n "$filename" '.[$n] // empty' scripts/release-asset-versions.json)
              if [ -n "$override" ]; then asset_version="$override"; fi
            fi

            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> "$MANIFEST"
            fi

            printf "    \"%s\": {\"version\": \"%s\", \"size\": %s, \"sha256\": \"%s\", \"platform\": \"%s\"}" "$filename" "$asset_version" "$size" "$sha256" "$platform" >> "$MANIFEST"
          done

          echo "" >> "$MANIFEST"
          echo "  }" >> "$MANIFEST"
          echo "}" >> "$MANIFEST"

          echo "Release manifest:"
          cat "$MANIFEST"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The release is created as a DRAFT with every asset already attached, and published by the
      # step below. A draft is not "latest" and is not visible to /releases/latest, so no updater
      # can see this version until it is COMPLETE: "latest" and "complete" become the same moment.
      #
      # Publishing first is what gave every release an update-failure window. Measured to the second
      # on v1.8.8: published 10:48:48Z, assets attached 10:54:11Z - five minutes and twenty-three
      # seconds in which /releases/latest named a version whose release-manifest.json did not exist.
      # A launcher checked at 10:54:05Z, before the manifest existed, and failed outright. With hourly
      # checks that is roughly one machine in eleven losing up to an hour, and a failed check used to
      # render exactly like being up to date, so nobody noticed.
      #
      # draft: true is therefore load-bearing, not a preference. Do not set it back to false to
      # "save a step" - the second step IS the publish.
      - name: Create draft release with all assets
        id: draft
        uses: softprops/action-gh-release@v3
        with:
          name: DevThrottle v${{ steps.version.outputs.version }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: ${{ steps.notes.outputs.path }}
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish only once the manifest is provably attached. Every updater resolves
      # release-manifest.json first and treats its absence as "this release is unusable", so a
      # release published without it is a release nobody can install - and it would take the
      # "latest" slot away from the previous working one.
      # Addressed by release ID, not by tag: a DRAFT is not reachable through the by-tag endpoint
      # (GitHub associates a draft with its tag only on publish), so a tag lookup here would be
      # asking the wrong question and could answer about the wrong release entirely.
      - name: Verify the manifest is attached, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          if [ -z "$RELEASE_ID" ]; then
            echo "::error title=No release id::The draft step produced no release id, so there is nothing to publish and no way to check what was attached."
            exit 1
          fi

          ASSETS=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '[.assets[].name] | join(" ")')
          echo "Attached assets: $ASSETS"
          case " $ASSETS " in
            *" release-manifest.json "*)
              ;;
            *)
              echo "::error title=Manifest not attached::Draft release $GITHUB_REF_NAME has no release-manifest.json. Refusing to publish - it would become 'latest' and no updater could install it."
              exit 1
              ;;
          esac

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false >/dev/null
          echo "Published $GITHUB_REF_NAME with all assets already attached."
          {
            echo "## Published"
            echo "\`$GITHUB_REF_NAME\` left draft with every asset attached, so there is no window in which it is latest but incomplete."
          } >> "$GITHUB_STEP_SUMMARY"
      # Mirror the files a PERSON downloads to a stable public address
      # (devthrottle_internal #1186). GitHub stays the archive: this holds ONLY
      # the current build, under names that never change. Per-version copies were
      # removed deliberately - GitHub already serves an immutable URL per version
      # for free, so a second copy bought nothing and doubled the storage.
      #
      # Why this exists: the GitHub download link is not a stable address. It
      # redirects twice, and the URL the browser actually fetches from carries a
      # per-asset GUID and a per-request signature, so no two downloads of ours
      # ever come from the same place. Every clean download we measured (mindzie,
      # three artifacts) sits at one fixed address overwritten in place; the one
      # Windows holds does not. Unproven as a fix - see devthrottle_internal
      # #1158 - but it is the only variable we can move while releasing daily.
      #
      # Only browser/agent-facing assets go here. The rest (gateway, director,
      # launcher, python, ffmpeg, pyenv) are fetched by our own installer after
      # it runs, never by a browser, so they stay on GitHub only.
      - name: Mirror downloads to Azure Blob
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          AZ_ACCOUNT: devthrottle
          AZ_CONTAINER: download
          AZ_KEY: ${{ secrets.AZURE_DOWNLOADS_KEY }}
        run: |
          set -euo pipefail

          # Guarded here rather than in `if:` - a step's own env block is not
          # reliably available to its own condition, and secrets cannot be read
          # in a condition at all. Unset key means the mirror is not configured,
          # which is not a release failure.
          if [ -z "${AZ_KEY:-}" ]; then
            echo "AZURE_DOWNLOADS_KEY not set - skipping the download mirror."
            exit 0
          fi

          PUBLIC_ASSETS="
            devthrottle-setup-win-x64.exe
            devthrottle-setup-cli-win-x64.exe
            devthrottle-setup-mac-arm64.zip
            devthrottle-mac-arm64.dmg
            devthrottle-setup-cli-mac-arm64
            devthrottle-setup-linux-x64
            devthrottle-setup-cli-linux-x64
            release-manifest.json
          "

          upload() {
            local file="$1" dest="$2" cache="$3" ctype="$4"
            echo "  -> $dest"
            az storage blob upload \
              --account-name "$AZ_ACCOUNT" --account-key "$AZ_KEY" \
              --container-name "$AZ_CONTAINER" \
              --file "$file" --name "$dest" --overwrite \
              --content-cache-control "$cache" \
              --content-type "$ctype" \
              --only-show-errors -o none
          }

          for name in $PUBLIC_ASSETS; do
            src="release-files/$name"
            if [ ! -f "$src" ]; then
              echo "MISSING from release-files, not mirrored: $name"
              continue
            fi
            case "$name" in
              *.json) ctype="application/json" ;;
              *)      ctype="application/octet-stream" ;;
            esac
            # One copy, one name, overwritten every release - so the download
            # address never changes. Short cache or people keep getting
            # yesterday's build. release-manifest.json alongside it says which
            # version is currently there, for anything that needs to know.
            upload "$src" "$name" "public, max-age=300" "$ctype"
          done

          echo "Mirrored to https://$AZ_ACCOUNT.blob.core.windows.net/$AZ_CONTAINER/"

      # Prove the mirror rather than trust the exit code: fetch the installer
      # back anonymously and check its SHA-256 against the manifest we just built.
      - name: Verify the mirrored installer
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          AZ_KEY: ${{ secrets.AZURE_DOWNLOADS_KEY }}
          BASE: https://devthrottle.blob.core.windows.net/download
        run: |
          set -euo pipefail
          if [ -z "${AZ_KEY:-}" ]; then
            echo "Mirror not configured - nothing to verify."
            exit 0
          fi
          expected=$(jq -r '.assets["devthrottle-setup-win-x64.exe"].sha256' release-files/release-manifest.json)
          curl -fsSL -o /tmp/mirrored.exe "$BASE/devthrottle-setup-win-x64.exe"
          actual=$(sha256sum /tmp/mirrored.exe | cut -d' ' -f1)
          echo "expected $expected"
          echo "actual   $actual"
          if [ "${expected,,}" != "${actual,,}" ]; then
            echo "MIRROR MISMATCH - the public URL is not serving this release"
            exit 1
          fi
          echo "Mirror verified: the public URL serves this release byte for byte."
