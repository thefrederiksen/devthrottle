# Prefix-rewriting reverse proxy for the Factory Boxes phase 1 spike.
# Serves a Selkies desktop that lives at "/" on 127.0.0.1:3120 under
# http://127.0.0.1:3130/boxes/test-box/desktop/ - the shape the Gateway relay will have.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
log_format spike '$time_iso8601 $status "$request" up=$upstream_status bytes=$body_bytes_sent upgrade="$http_upgrade" rt=$request_time';
server {
  listen 127.0.0.1:3130;
  access_log /var/log/nginx/spike-access.log spike;

  # No trailing slash: the page computes its base from the folder of its own address,
  # so "/boxes/test-box/desktop" would give a base of "/boxes/test-box". Redirect, relative.
  location = /boxes/test-box/desktop {
    return 301 /boxes/test-box/desktop/;
  }

  location /boxes/test-box/desktop/ {
    # The trailing slash on proxy_pass strips the prefix: /boxes/test-box/desktop/x -> /x
    proxy_pass http://127.0.0.1:3120/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Anything outside the prefix is a request the page should never make. Log it loudly.
  location / {
    return 404 "outside the box prefix\n";
  }
}
