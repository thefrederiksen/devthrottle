# Variant: the image is told its base path (SUBFOLDER=/boxes/test-box/desktop/), so the proxy forwards the path UNCHANGED.
server {
  listen 127.0.0.1:3131;
  access_log /var/log/nginx/spike-subfolder-access.log spike;
  location /boxes/test-box/desktop/ {
    proxy_pass http://127.0.0.1:3121;   # no trailing slash: path forwarded as is
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 0;
    proxy_read_timeout 3600s;
  }
  location / { return 404 "outside the box prefix\n"; }
}
