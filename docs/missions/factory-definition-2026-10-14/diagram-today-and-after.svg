<text x="20" y="604" style="font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:12px;font-weight:normal" fill="#3d4450" text-anchor="start" xml:space="preserve">2, 3 and 6, plus from 1 the registry, schedules,</text>
