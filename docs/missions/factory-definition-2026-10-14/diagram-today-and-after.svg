<text x="20" y="699" style="font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:12px;font-weight:normal" fill="#3d4450" text-anchor="start" xml:space="preserve">everything in 4, and from 1 the activity, run</text>
<text x="20" y="714" style="font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:12px;font-weight:normal" fill="#3d4450" text-anchor="start" xml:space="preserve">results, memory and goal numbers - never versioned</text>
<text x="20" y="729" style="font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:12px;font-weight:normal" fill="#3d4450" text-anchor="start" xml:space="preserve">with the definition</text>
<rect x="8" y="751" width="424" height="70" rx="8" fill="#fff4e0" stroke="#b26a00" stroke-width="2"/>
