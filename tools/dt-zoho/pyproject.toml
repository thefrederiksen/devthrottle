[project]
name = "dt-zoho"
version = "0.1.0"
description = "Zoho Mail, Calendar and admin through Zoho's own API: read, search, attachments, with the key kept in cc-secrets"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "cryptography>=42.0",
    "cc-shared",
    "cc-storage",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
dt-zoho = "dt_zoho.cli:tool_main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dt_zoho"]
package-dir = {"dt_zoho" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
