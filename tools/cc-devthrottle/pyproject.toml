[project]
name = "cc-devthrottle"
version = "1.3.0"
description = "Unified DevThrottle command-line surface"
requires-python = ">=3.11"
dependencies = [
    # The floors are tested: continuous integration job tool-contracts installs exactly these
    # versions in its `floor` leg. Click 8.2.1 is the first CliRunner that always hands back
    # stderr separately (the tests read result.stderr); Typer 0.16.1 is the first that supports it.
    "typer>=0.16.1",
    "click>=8.2.1",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "cc-shared",
]

[project.scripts]
cc-devthrottle = "cc_devthrottle.cli:app"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cc_devthrottle"]
package-dir = {"cc_devthrottle" = "src"}
