[project]
name = "cc-dev-reports"
version = "0.1.0"
description = "Publish a dev report to the owner through the Gateway, and reply to the owner in it"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "cc-shared",
]

[project.scripts]
cc-dev-reports = "cc_dev_reports.cli:app"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cc_dev_reports"]
package-dir = {"cc_dev_reports" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
