<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dev report test host</title>
<style>
  body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
  iframe { display: block; width: 100%; height: 700px; border: 0; border-bottom: 2px solid #D5D8DE; }
  #log { font-family: Consolas, monospace; font-size: 12px; white-space: pre-wrap; padding: 8px; }
</style>
</head>
<body>
<!--
  A TEST host - it stands in for the Cockpit, the phone and the Director, which do not show reports yet
  (phases 3 and 4). It does what CONTRACT.md section 4 says a host MUST do, and nothing more:
    - shows the report in <iframe sandbox="allow-scripts"> with NO allow-same-origin,
    - builds the frame's document itself: its own head FIRST, holding the Content-Security-Policy and the
      note-taking script with a fresh nonce and token, and only then the report's bytes - it never searches
      the report text for a place to insert anything,
    - accepts exactly one thing on the window: a ready from its frame that carries the current token and a
      message port; everything else, both ways, goes over that port,
    - closes the port on any frame load it did not cause,
    - records what it accepted and refused, for the proof driver to read.
  Which report it shows is the ?report= query parameter (default sample-report.html).
-->
<iframe id="report" sandbox="allow-scripts" title="Dev report"></iframe>
<div id="log"></div>
<script>
  var CHANNEL = "devthrottle.dev-report";
  var frame = document.getElementById("report");
  var saved = { queued: [], sent: [], replies: [], draft: null, answerDrafts: [], scroll: { x: 0, y: 0 } };
  var parts = null;
  var token = "";
  var port = null;
  var expectingLoad = false;
  window.__received = [];
  window.__refused = [];
  window.__unexpectedLoads = 0;

  function log(line) {
    document.getElementById("log").textContent += line + "\n";
  }

  function random() {
    var bytes = new Uint8Array(16);
    crypto.getRandomValues(bytes);
    return Array.prototype.map.call(bytes, function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
  }

  function closePort() {
    if (port) port.close();
    port = null;
  }

  // Returns false, and sends nothing, when there is no port to the report this host loaded.
  function send(type, payload) {
    if (!port) return false;
    port.postMessage({ channel: CHANNEL, version: 1, type: type, payload: payload });
    return true;
  }
  window.__hostSend = send;
  // For the proof only: put an arbitrary (possibly malformed) message on the port.
  window.__hostSendRaw = function (data) {
    if (!port) return false;
    port.postMessage(data);
    return true;
  };
  window.__isConnected = function () { return port !== null; };

  function refuse(data, why) {
    window.__refused.push({ type: data && data.type, why: why });
    log("refused " + (data && data.type) + " (" + why + ")");
  }

  window.addEventListener("message", function (event) {
    if (event.source !== frame.contentWindow) return;
    var data = event.data;
    if (!data || data.channel !== CHANNEL || data.version !== 1) return;
    if (data.type !== "ready") return refuse(data, "only ready comes on the window");
    if (!token || data.token !== token) return refuse(data, data.token === undefined ? "no token" : "wrong token");
    if (!event.ports || event.ports.length !== 1) return refuse(data, "no port");
    token = ""; // one ready per load
    closePort();
    port = event.ports[0];
    port.onmessage = function (e) {
      var m = e.data;
      if (!m || m.channel !== CHANNEL || m.version !== 1) return;
      window.__received.push(m);
      log(m.type);
      if (m.type === "state-changed") saved = m.payload.state;
    };
    window.__received.push(data);
    log("ready");
    send("restore", { state: saved });
  });

  frame.addEventListener("load", function () {
    if (expectingLoad) {
      expectingLoad = false;
      return;
    }
    token = "";
    closePort();
    window.__unexpectedLoads++;
    log("the frame loaded something this host did not put there - port closed");
  });

  function load() {
    var nonce = random();
    token = random();
    closePort();
    var head = "<!doctype html><html><head>" +
      "<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; script-src 'nonce-" + nonce +
      "'; style-src 'unsafe-inline'; img-src data:; font-src data:; base-uri 'none'; form-action 'none'\">" +
      "<script nonce=\"" + nonce + "\" data-dev-report-token=\"" + token + "\">" + parts.script + "<\/script>" +
      "</head>";
    expectingLoad = true;
    frame.srcdoc = head + parts.report;
  }

  // Reloading the frame is what an app does when the agent edits the report: the page starts over with
  // no memory, and the host hands its state back.
  window.__reload = load;

  var reportName = new URLSearchParams(location.search).get("report") || "sample-report.html";
  Promise.all([fetch(reportName).then(function (r) { return r.text(); }),
               fetch("dev-report-notes.js").then(function (r) { return r.text(); })])
    .then(function (texts) {
      parts = { report: texts[0], script: texts[1] };
      load();
    });
</script>
</body>
</html>
