<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dev report test host</title>
<style>
  body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
  iframe { display: block; width: 100%; height: 700px; border: 0; border-bottom: 2px solid #D5D8DE; }
  #log { font-family: Consolas, monospace; font-size: 12px; white-space: pre-wrap; padding: 8px; }
</style>
</head>
<body>
<!--
  A TEST host - it stands in for the Cockpit, the phone and the Director, which do not exist yet for
  reports (phases 3 and 4). It does what the contract says a host does and nothing more:
    - shows the report in <iframe sandbox="allow-scripts"> with NO allow-same-origin (mission ruling 1),
    - injects the ONE note-taking script into the report,
    - answers the page's ready with restore (the state it saved from the last state-changed),
    - accepts messages only from its own frame,
    - records every message it receives in window.__received for the proof driver to read.
-->
<iframe id="report" sandbox="allow-scripts" title="Dev report"></iframe>
<div id="log"></div>
<script>
  var CHANNEL = "devthrottle.dev-report";
  var frame = document.getElementById("report");
  var saved = { queued: [], sent: [], replies: [], draft: null, scroll: { x: 0, y: 0 } };
  var parts = null;
  window.__received = [];

  function send(type, payload) {
    frame.contentWindow.postMessage({ channel: CHANNEL, version: 1, type: type, payload: payload }, "*");
  }

  window.__hostSend = send;

  window.addEventListener("message", function (event) {
    if (event.source !== frame.contentWindow) return;
    var data = event.data;
    if (!data || data.channel !== CHANNEL || data.version !== 1) return;
    window.__received.push(data);
    document.getElementById("log").textContent += data.type + "\n";
    if (data.type === "ready") send("restore", { state: saved });
    if (data.type === "state-changed") saved = data.payload.state;
  });

  function load() {
    var html = parts.report.replace("</body>", function () { return "<script>" + parts.script + "<\/script></body>"; });
    frame.srcdoc = html;
  }

  // Reloading the frame is what an app does when the agent edits the report: the page starts over with
  // no memory, and the host hands its state back.
  window.__reload = load;

  Promise.all([fetch("sample-report.html").then(function (r) { return r.text(); }),
               fetch("dev-report-notes.js").then(function (r) { return r.text(); })])
    .then(function (texts) {
      parts = { report: texts[0], script: texts[1] };
      load();
    });
</script>
</body>
</html>
